          readyDate = addBusinessDays(asOf, 2);
          readyLabel = '1–2 business days';
        } else if (extrusionUnknown) {
          readyDate = addContinuousExtrusionWithFreightPickup(asOf, processDays).dispatchDate;
          readyLabel = `At least ${processDays} days (process only — billet coverage unknown)`;
        } else {
          readyDate = addContinuousExtrusionWithFreightPickup(asOf, totalCalendarDays).dispatchDate;
          readyLabel = `${totalCalendarDays} calendar days`;
        }
        return {
          available, requested, needsProduction, coveragePct,
          queueQty, queueLines, queueCovered, queueShortfall,
          remainingForOrder, shortfall, sheetsToMake,
          sheetsPerBillet, billetsNeeded,
          billetStock, billetStockKnown, billetShortfall,
          fsInHr, billetsPerDay, extrusionDays, extrusionUnknown,
          processDays, totalCalendarDays, readyDate, readyLabel,
          runningMatches, isFsRunning, turnoverDays,
        };
      }, [selectedFs, fsQty, quoteAsOfDate, fsQueueOrders, billetByType, fsRunningLines, fsRateByFamily]);

        return { key: k, qty: billetByType[k], thickness: p ? parseFloat(p.thickness) : 99, lengthFt: p ? parseInt(p.lengthFt, 10) : 99, color: p ? p.color : k };

                            <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Remaining For This Order</span><span className="text-sm font-extrabold text-slate-900">{fsCalc.remainingForOrder.toLocaleString()} EACH</span></div>
                            <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Shortfall / Sheets To Make</span><span className="text-sm font-extrabold text-slate-900">{fsCalc.shortfall.toLocaleString()} / {fsCalc.sheetsToMake.toLocaleString()} EACH</span></div>
                            <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Billet Type / Stock</span><span className="text-sm font-extrabold text-slate-900">{selectedFs.billetKey || `Unknown (die ${selectedFs.dieFamily})`} / {fsCalc.billetStock != null ? `${fsCalc.billetStock.toLocaleString()} billets` : 'not listed'}</span></div>
                            <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Billets Needed</span><span className="text-sm font-extrabold text-slate-900">{fsCalc.billetsNeeded > 0 ? `${fsCalc.billetsNeeded.toLocaleString()} billets` : (fsCalc.needsProduction ? '— cannot compute' : '0')}</span></div>
                            <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Extrusion Time</span><span className="text-sm font-extrabold text-slate-900">{fsCalc.extrusionUnknown ? 'Unknown — billet coverage missing' : (fsCalc.billetShortfall > 0 ? `${fsCalc.extrusionDays} days (${fsCalc.billetShortfall.toLocaleString()} billets ÷ ${fsCalc.billetsPerDay.toFixed(1)}/day at ${fsCalc.fsInHr.toFixed(1)} in/hr)` : 'None — billet stock covers it')}</span></div>
                            <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Line Status / Turnover</span><span className="text-sm font-extrabold text-slate-900">{!fsCalc.needsProduction ? 'In stock — no line time needed' : (fsCalc.isFsRunning ? `Running on ${fsCalc.runningMatches.map(m => m.lineLabel).join(', ')} — no turnover` : (fsCalc.turnoverDays > 0 ? `Not running in this color — ${fsCalc.turnoverDays}-day turnover added (current orders first, then die changeover + heat-up)` : 'Not running in this color — turnover not counted (billet coverage unknown)'))}</span></div>
                          </div>
                          {fsCalc.needsProduction && (
                            <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs font-medium text-amber-800 flex gap-2 items-start">
                              <Info className="w-4 h-4 shrink-0 mt-0.5" />
                              <span>Process allowance: {fsCalc.processDays} days — skive, then 2 days in the curtain room, then square at the panel saw, then plane. {fsCalc.billetsNeeded > 0 && fsCalc.sheetsPerBillet > 0 ? `Billets = ${fsCalc.sheetsToMake.toLocaleString()} sheets ÷ ${fsCalc.sheetsPerBillet} sheet${fsCalc.sheetsPerBillet === 1 ? '' : 's'} per billet.` : ''} {fsCalc.turnoverDays > 0 ? `Plus ${fsCalc.turnoverDays} days die turnover: this billet family + color is not currently running on any full-sheet line (per the Inspection Sheet), so the current orders run first, then the die is changed over and heated to this color before extrusion.` : ''} Ready date runs on calendar days (7-day production) and rolls to Monday when freight pickup would land on a weekend.</span>
                            </div>
                          )}
                          <p className="text-[11px] text-slate-400">Note: Sales 2.0 Qty On Order and the OOR line total can differ — the OOR total is the queue used here, the same way the profile calculator treats them.</p>
                          {fsCalc.queueLines.length > 0 && (
                            <div>
                              <h4 className="text-xs font-bold text-slate-900 mb-2">Open FS Orders Ahead Of This Quote</h4>
                              <div className="overflow-x-auto border border-slate-200 rounded-xl">
                                <table className="w-full text-left text-xs border-collapse">
                                  <thead className="bg-slate-50/80 border-b border-slate-200 text-slate-600 uppercase text-[10px] tracking-wider font-bold">
                                    <tr><th className="py-2.5 px-3">SO #</th><th className="py-2.5 px-3">Customer</th><th className="py-2.5 px-3">Item</th><th className="py-2.5 px-3 text-right">Qty</th><th className="py-2.5 px-3">Promise</th></tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                                    {fsCalc.queueLines.map(o => (
                                      <tr key={o.id} className="hover:bg-blue-50/40 transition">
                                        <td className="py-2 px-3"><button onClick={() => setSelectedOrder(o)} className="text-blue-600 hover:underline font-bold">{o.soNum}</button></td>
                                        <td className="py-2 px-3">{o.customer}</td>
                                        <td className="py-2 px-3">{o.itemPart}</td>
                                        <td className="py-2 px-3 text-right font-mono">{o.qty.toLocaleString()} {o.uom}</td>
                                        <td className="py-2 px-3">{o.promiseDate}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          )}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ) : (
              /* Fallback for any unknown tab */
              <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center max-w-2xl mx-auto my-8">
                <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                  <Layers className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-900 capitalize">{activeTab} View</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-md mx-auto">
                  Live data for this sheet is fully connected from your Google Apps Script backend and synchronizing with your sales lead time calculations.
                </p>
                <button
                  onClick={() => setActiveTab('leadtime')}
                  className="mt-4 px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition"
                >
                  Return to Lead Time Calculator
                </button>
              </div>
            )}
          {/* Inventory OOR Modal: opened by clicking a Qty On Order number
              in the Inventory Stock tab. Its SO numbers open the order card. */}
          {oorModalItem && (() => {
            const backlogQty = oorOrdersForItem.reduce((sum, o) => sum + (o.qty || 0), 0);
            return (
              <div
                className="fixed inset-0 bg-black/50 flex items-start justify-center p-4 pt-10 z-50 overflow-y-auto"
                onClick={() => setOorModalItem(null)}
              >
                <div
                  className="bg-white rounded-2xl shadow-xl max-w-4xl w-full p-6 space-y-5"
                  onClick={e => e.stopPropagation()}
                >
                  <div className="flex items-start justify-between border-b border-slate-200 pb-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">OOR OPEN ORDERS</span>
                        <h2 className="text-lg font-extrabold text-slate-900">{oorModalItem.partNumber}</h2>
                      </div>
                      <p className="text-xs text-slate-500 font-medium mt-1">{oorModalItem.description}</p>
                    </div>
                    <button onClick={() => setOorModalItem(null)} className="text-slate-400 hover:text-slate-700 text-xl leading-none px-1">×</button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Inventory Qty On Order</span><span className="text-sm font-extrabold text-blue-700">{oorModalItem.qtyOnOrder.toLocaleString()} {oorModalItem.uom}</span></div>
                    <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Available In Stock</span><span className="text-sm font-extrabold text-emerald-700">{oorModalItem.qtyAvailable.toLocaleString()} {oorModalItem.uom}</span></div>
                    <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Active OOR Line Items</span><span className="text-sm font-extrabold text-slate-900">{oorOrdersForItem.length} Orders</span></div>
                    <div className="bg-slate-50 rounded-xl border border-slate-200 p-3"><span className="text-[10px] uppercase font-bold text-slate-500 block">Total Quantity In Backlog</span><span className="text-sm font-extrabold text-purple-700">{backlogQty.toLocaleString()} {oorModalItem.uom}</span></div>
                  </div>

                  {oorOrdersForItem.length === 0 ? (
                    <p className="text-xs text-slate-500 font-medium">No open orders in OOR match this part family (same die and color). Note the Inventory Qty On Order above comes from Sales 2.0 and can differ from the OOR line total.</p>
                  ) : (
                    <div className="overflow-x-auto border border-slate-200 rounded-xl">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead className="bg-slate-50/80 border-b border-slate-200 text-slate-600 uppercase text-[10px] tracking-wider font-bold">
                          <tr>
                            <th className="py-3 px-3">SO #</th>
                            <th className="py-3 px-3">Customer</th>
                            <th className="py-3 px-3">Ship To Address</th>
                            <th className="py-3 px-3 text-right">Quantity Ordered</th>
                            <th className="py-3 px-3 text-center">Order Date</th>
                            <th className="py-3 px-3 text-center">Promise Date</th>
                            <th className="py-3 px-3 text-center">Profile Die</th>
                            <th className="py-3 px-3 text-center">Color / Resin</th>
                            <th className="py-3 px-3 text-center">Packaging / Fulfillment Status</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-medium text-slate-700">
                          {oorOrdersForItem.map((ord) => (
                            <tr key={ord.id} className="hover:bg-blue-50/40 transition">
                              <td className="py-2.5 px-3 font-bold text-blue-600"><button onClick={() => setSelectedOrder(ord)} className="hover:underline">{ord.soNum}</button></td>
                              <td className="py-2.5 px-3"><span className="font-medium text-slate-900">{ord.customer}</span><span className="block text-slate-500">SKU: {ord.itemPart}</span></td>
                              <td className="py-2.5 px-3 text-slate-500 whitespace-pre-line">{ord.shipTo || '—'}</td>
                              <td className="py-2.5 px-3 text-right font-extrabold text-slate-900">{ord.qty.toLocaleString()} {ord.uom}</td>
                              <td className="py-2.5 px-3 text-center text-slate-500">{ord.orderDate}</td>
                              <td className="py-2.5 px-3 text-center text-slate-800">{ord.promiseDate}</td>
                              <td className="py-2.5 px-3 text-center">{ord.profileDie}</td>
                              <td className="py-2.5 px-3 text-center">{ord.colorResin}</td>
                              <td className="py-2.5 px-3 text-center">{ord.status === 'Scheduled' ? 'Scheduled in Queue' : ord.status}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}

                  <div className="flex items-center justify-between pt-1">
                    <button
                      onClick={() => { setSelectedPartId(oorModalItem.id); setOorModalItem(null); setActiveTab('leadtime'); }}
                      className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700 transition"
                    >
                      Calculate Lead Time for this SKU
                    </button>
                    <button onClick={() => setOorModalItem(null)} className="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-700 transition">Close</button>
                  </div>
                </div>
              </div>
            );
          })()}
          {/* Order Card Modal: opened by clicking any SO number. */}
          {selectedOrder && (() => {
            const stockItem = inventoryList.find(i =>
              i.partNumber.toUpperCase() === selectedOrder.newPartNum.toUpperCase()
              || i.partNumber.toUpperCase() === selectedOrder.itemPart.toUpperCase());
            const loadIntoCalculator = () => {
              if (!stockItem) return;
              setSelectedPartId(stockItem.id);
              // Lead Time qty is in feet. FEET orders load as-is; EACH
              // orders convert via finished cut length (pieces x in / 12).
              if (selectedOrder.uom === 'FEET') {
                setInquiredQty(Math.round(selectedOrder.qty));
              } else if (selectedOrder.fgLength) {
                setInquiredQty(Math.round(selectedOrder.qty * selectedOrder.fgLength / 12));
              }
              setSelectedOrder(null);
              setActiveTab('leadtime');
            };
            return (
              <div
                className="fixed inset-0 bg-black/50 flex items-start justify-center p-4 pt-10 z-[60] overflow-y-auto"
                onClick={() => setSelectedOrder(null)}
              >
                <div
                  className="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 space-y-5"
                  onClick={e => e.stopPropagation()}
                >
                  <div className="flex items-start justify-between border-b border-slate-200 pb-4">
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-blue-100 text-blue-800">SALES ORDER</span>
                        <h2 className="text-lg font-extrabold text-slate-900">SO #{selectedOrder.soNum}</h2>
                      </div>
                      <p className="text-xs text-slate-500 font-medium mt-1">
                        Customer PO: {selectedOrder.po || '—'} • CSR: {selectedOrder.csr}
                      </p>
                    </div>
                    <button onClick={() => setSelectedOrder(null)} className="text-slate-400 hover:text-slate-700 text-xl leading-none px-1">×</button>
                  </div>

                  <div className="bg-slate-50 rounded-xl border border-slate-200 p-4 space-y-3">
                    <h3 className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Customer & Delivery Information</h3>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div><span className="text-slate-500 block">Customer Name</span><span className="font-bold text-slate-900">{selectedOrder.customer}</span>{selectedOrder.account && <span className="block text-slate-500">Acct #{selectedOrder.account}</span>}</div>
                      <div><span className="text-slate-500 block">Ship Via / Method</span><span className="font-bold text-slate-900">{selectedOrder.shipVia || '—'}</span></div>
                    </div>
                    <div className="text-xs"><span className="text-slate-500 block">Ship To Address</span><span className="font-medium text-slate-900 whitespace-pre-line">{selectedOrder.shipTo || '—'}</span></div>
                  </div>

                  <div className="bg-slate-50 rounded-xl border border-slate-200 p-4 space-y-3">
                    <h3 className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Part & Tooling Profile Specifications</h3>
                    <div className="text-xs"><span className="text-slate-500 block">Part Code / Item</span><span className="font-bold text-slate-900">{selectedOrder.newPartNum || selectedOrder.itemPart}</span><span className="block text-slate-500">{selectedOrder.description}</span></div>
                    <div className="grid grid-cols-3 gap-3 text-xs">
                      <div><span className="text-slate-500 block">Profile Die</span><span className="font-bold text-slate-900">{selectedOrder.profileDie}</span></div>
                      <div><span className="text-slate-500 block">Color / Resin</span><span className="font-bold text-slate-900">{selectedOrder.colorResin}</span></div>
                      <div><span className="text-slate-500 block">Finished Cut Length</span><span className="font-bold text-slate-900">{selectedOrder.fgLength ? `${selectedOrder.fgLength}"` : '—'}</span></div>
                      <div><span className="text-slate-500 block">Linear Weight (lbs/in)</span><span className="font-bold text-slate-900">{selectedOrder.lbsIn != null ? selectedOrder.lbsIn.toFixed(4) : '—'}</span></div>
                      <div><span className="text-slate-500 block">Est. Unit Weight</span><span className="font-bold text-slate-900">{selectedOrder.unitWeight != null ? `${selectedOrder.unitWeight.toFixed(2)} lbs` : '—'}</span></div>
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-slate-50 rounded-xl border border-slate-200 p-4 space-y-2 text-xs">
                      <h3 className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Quantity & Delivery Schedule</h3>
                      <div><span className="text-slate-500 block">Quantity Ordered</span><span className="font-bold text-slate-900">{selectedOrder.qty.toLocaleString()} {selectedOrder.uom}</span></div>
                      <div><span className="text-slate-500 block">Order Placed Date</span><span className="font-bold text-slate-900">{selectedOrder.orderDate}</span></div>
                      <div><span className="text-slate-500 block">Promised Ship Date</span><span className="font-bold text-slate-900">{selectedOrder.promiseDate}</span></div>
                      {selectedOrder.tracking && <div><span className="text-slate-500 block">Tracking Number</span><span className="font-bold text-slate-900">{selectedOrder.tracking}</span></div>}
                      {selectedOrder.lot && <div><span className="text-slate-500 block">Lot #</span><span className="font-bold text-slate-900">{selectedOrder.lot}</span></div>}
                      {selectedOrder.totalWeight != null && <div><span className="text-slate-500 block">Total Weight</span><span className="font-bold text-slate-900">{selectedOrder.totalWeight.toLocaleString()} lbs</span></div>}
                    </div>
                    <div className="bg-slate-50 rounded-xl border border-slate-200 p-4 space-y-2 text-xs">
                      <h3 className="text-[10px] font-extrabold uppercase tracking-wider text-slate-500">Packaging & Fulfillment Status</h3>
                      <div><span className="text-slate-500 block">Packaging Status</span><span className="font-bold text-slate-900">{selectedOrder.status === 'Scheduled' ? 'Scheduled in Queue' : selectedOrder.status}</span></div>
                      <div><span className="text-slate-500 block">Pickings Archive</span><span className="font-bold text-slate-900">{selectedOrder.pickings || '—'}</span></div>
                      <div><span className="text-slate-500 block">Fulfillment Details</span><span className="font-bold text-slate-900">{selectedOrder.fulfillment || 'No fulfillment recorded yet'}</span></div>
                    </div>
                  </div>

                  <div className="flex items-center justify-between pt-1">
                    <button
                      onClick={loadIntoCalculator}
                      disabled={!stockItem}
                      title={stockItem ? 'Load this part and quantity into the Lead Time Calculator' : 'This part was not found in the inventory stock list'}
                      className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-semibold hover:bg-blue-700 transition disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                      Load into Lead Time Calculator
                    </button>
                    <button onClick={() => setSelectedOrder(null)} className="px-4 py-2 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-700 transition">Close</button>
                  </div>
                </div>
              </div>
            );
          })()}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
