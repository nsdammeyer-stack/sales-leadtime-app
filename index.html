<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sales Lead Time Calculator & Stock Inquiry</title>
  
  <!-- Tailwind CSS & React via browser CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.344.0"
    }
  }
  </script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100/70 text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';
    import {
      Search, Clock, Calendar, CheckCircle2, AlertTriangle, AlertCircle,
      Package, Truck, Layers, Wrench, Plus, Edit2, Trash2,
      FileText, Sparkles, X, Info, ShieldCheck, MapPin, Flame,
      Bookmark, Gauge, Zap, Activity, ExternalLink, RefreshCw, ChevronRight
    } from 'lucide-react';

    // =========================================================================
    // GOOGLE APPS SCRIPT URL
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzyYSr3-UnFMnUYsxf9oNdG8wJqM4g5W8TO_NfM0s71cJjwZw3RdTUkp5gaBDGLtFsh/exec?action=leadtime";

    // Simple casual password gate. This is NOT real security: the
    // password is visible in this file, and the Apps Script data
    // endpoint is open to anyone with its URL. It only keeps casual
    // visitors from opening the app. Only an "unlocked" flag is stored
    // in sessionStorage, never the password itself.
    const GATE_PASSWORD = "3311";
    const GATE_SESSION_KEY = "sales-leadtime-unlocked";

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);
      // Background refresh state. A background refresh never sets
      // `loading`, so it never blanks the screen with the spinner, and
      // it never clears the user's selection, quantity or search text.
      const [refreshing, setRefreshing] = useState(false);
      const [refreshError, setRefreshError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);
      // Password gate state. sessionStorage means the gate asks once per
      // browser session: closing the browser asks again, but the
      // 30-minute background refreshes never re-prompt.
      const [authorized, setAuthorized] = useState(() => {
        try {
          return sessionStorage.getItem(GATE_SESSION_KEY) === "ok";
        } catch (e) {
          return false;
        }
      });
      const [gateInput, setGateInput] = useState("");
      const [gateError, setGateError] = useState(false);
      const [activeTab, setActiveTab] = useState('leadtime');

      // Inquiry & Calculation States
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedPartId, setSelectedPartId] = useState(null);
      const [inquiredQty, setInquiredQty] = useState(1000);
      const [customerName, setCustomerName] = useState('');
      const [internalNotes, setInternalNotes] = useState('');
      const [isRushOrder, setIsRushOrder] = useState(false);
      const [calculationRule, setCalculationRule] = useState('auto');
      const [quoteAsOfDate, setQuoteAsOfDate] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      });

      // Tab 2: Inventory View Filter States
      const [invSearchQuery, setInvSearchQuery] = useState('');
      const [invFilterStock, setInvFilterStock] = useState('all');

      // Tab 3: OOR View Filter States
      const [oorSearchQuery, setOorSearchQuery] = useState('');
      const [oorSelectedDie, setOorSelectedDie] = useState('ALL');

      // Fetch live data from Google Sheets.
      // Initial load: shows the spinner and, on failure, the error screen.
      // Background refresh (manual button or the 30-minute timer): fetches
      // silently and only swaps data in on success. On failure the old
      // data stays on screen and only a small warning is shown.
      const fetchData = (background = false) => {
        if (background) setRefreshing(true);
        else setLoading(true);
        fetch(API_URL, {
          method: 'GET',
          redirect: 'follow',
        })
          .then(res => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
          })
          .then(json => {
            if (!Array.isArray(json)) {
              throw new Error("Received unexpected response from Google Sheets. Ensure you deployed a 'New Version' in Apps Script.");
            }
            setData(json);
            setLastUpdated(new Date());
            setRefreshError(null);
            setLoading(false);
            setRefreshing(false);
          })
          .catch(err => {
            console.error("Error loading sheet data:", err);
            if (background) {
              setRefreshError(err.toString());
              setRefreshing(false);
            } else {
              setLoadError(err.toString());
              setLoading(false);
            }
          });
      };

      useEffect(() => {
        // No data is fetched at all until the gate is unlocked.
        if (!authorized) return;
        fetchData();
        // Background refresh every 30 minutes. The timer is cleaned up
        // when the app unmounts, and browsers throttle timers in hidden
        // tabs, so a tab left open in the background will not hammer the
        // endpoint at full rate.
        const timer = setInterval(() => fetchData(true), 30 * 60 * 1000);
        return () => clearInterval(timer);
      }, [authorized]);

      // Date & Business Day Helpers
      const parseSafeDate = (dStr) => {
        if (!dStr || typeof dStr !== 'string') return new Date();
        const clean = dStr.split('T')[0].trim();
        const parts = clean.split('-');
        if (parts.length === 3) {
          const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m - 1, d);
        }
        const slashParts = clean.split('/');
        if (slashParts.length === 3) {
          const m = parseInt(slashParts[0], 10), d = parseInt(slashParts[1], 10), y = parseInt(slashParts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m - 1, d);
        }
        return new Date();
      };

      const formatSafeDate = (d) => {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      };

      const formatRawDate = (dateVal) => {
        if (!dateVal) return '—';
        const str = String(dateVal).split('T')[0].trim();
        const d = parseSafeDate(str);
        if (isNaN(d.getTime())) return str;
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      };

      const addBusinessDays = (startDate, days) => {
        const d = new Date(startDate.getTime());
        let added = 0;
        while (added < days) {
          d.setDate(d.getDate() + 1);
          const day = d.getDay();
          if (day !== 0 && day !== 6) added++;
        }
        return d;
      };

      const countBusinessDays = (startDate, endDate) => {
        if (!startDate || !endDate) return 1;
        let count = 0;
        const cur = new Date(startDate.getTime());
        cur.setHours(0, 0, 0, 0);
        const end = new Date(endDate.getTime());
        end.setHours(0, 0, 0, 0);
        while (cur < end) {
          cur.setDate(cur.getDate() + 1);
          const day = cur.getDay();
          if (day !== 0 && day !== 6) count++;
        }
        return Math.max(1, count);
      };

      const addContinuousExtrusionWithFreightPickup = (startDate, continuousDays) => {
        const d = new Date(startDate.getTime());
        const daysToAdd = Math.max(1, Math.ceil(continuousDays));
        d.setDate(d.getDate() + daysToAdd);
        const dayOfWeek = d.getDay();
        let freightRollDays = 0;
        if (dayOfWeek === 6) { d.setDate(d.getDate() + 2); freightRollDays = 2; }
        else if (dayOfWeek === 0) { d.setDate(d.getDate() + 1); freightRollDays = 1; }
        return { dispatchDate: d, totalCalendarDays: daysToAdd + freightRollDays, freightRollDays };
      };

      const extractBaseDie = (codeStr) => {
        if (!codeStr || typeof codeStr !== 'string') return '';
        const clean = codeStr.trim().toUpperCase();
        const rdMatch = clean.match(/^(RD-\d{2,4})/i);
        if (rdMatch) return rdMatch[1].toUpperCase();
        const compoundMatch = clean.match(/^([A-Z0-9]{2,5}-\d{2,4}(?:CR|BC|R|S))\b/i);
        if (compoundMatch) return compoundMatch[1].toUpperCase();
        const stdMatch = clean.match(/^([A-Z0-9]{2,5}-\d{2,4})/i);
        if (stdMatch) return stdMatch[1].toUpperCase();
        const prefixMatch = clean.match(/^([A-Z0-9]+-[A-Z0-9]+)/i);
        return prefixMatch ? prefixMatch[1].toUpperCase() : clean.split(/[^A-Z0-9-]/)[0] || clean;
      };

      // Range extraction
      const salesRange = data?.find(d => d.name === 'Sales 2.0') || data?.[0];
      const oorRange = data?.find(d => d.name === 'OOR') || data?.[1];
      const masterPartRange = data?.find(d => d.name === 'Master Part 2.0') || data?.[2];
      const ratesRange = data?.find(d => d.name === 'RatesByProfile') || data?.[3];
      const inspRange = data?.find(d => d.name === 'Inspection Sheet') || data?.[4];

      // Master Part 2.0 lookup, keyed by New Part Number (column I).
      // Sales 2.0 has no description column: its column G is "Date of Last
      // Audit", so descriptions, weight and cavities must come from here.
      const masterPartByPart = useMemo(() => {
        const map = {};
        if (!masterPartRange?.data) return map;
        masterPartRange.data.forEach(r => {
          if (!r.row || !r.row[8]) return;
          const key = String(r.row[8]).trim().toUpperCase();
          if (key && !map[key]) {
            map[key] = {
              description: String(r.row[10] || '').trim(),
              weightFt: parseFloat(r.row[5]) || null,
              cavities: parseInt(r.row[17], 10) || null,
            };
          }
        });
        return map;
      }, [masterPartRange]);

      // Parse Inventory List (Sales 2.0)
      const inventoryList = useMemo(() => {
        if (!salesRange?.data) return [];
        return salesRange.data.filter(r => r.index_ > 0 && r.row && (r.row[1] || r.row[0])).map(r => {
          const partNumber = String(r.row[1] || '').trim();
          const sage = String(r.row[0] || '').trim();
          const master = masterPartByPart[partNumber.toUpperCase()] || {};
          const desc = master.description || partNumber;
          const lastAudit = r.row[8] ? String(r.row[8]).trim() : '—';
          return {
            id: `${r.index_}-${partNumber}`,
            partNumber: partNumber || sage,
            sage: sage || partNumber,
            description: desc,
            uom: String(r.row[2] || 'FEET').trim().toUpperCase(),
            length: parseFloat(r.row[3]) || 120,
            qtyAvailable: parseFloat(r.row[5]) || 0,
            qtyOnOrder: parseFloat(r.row[4]) || 0,
            loc1: r.row[7] ? String(r.row[7]).trim() : 'None',
            lastAudit: lastAudit !== '' ? lastAudit : '—',
            weightFt: master.weightFt,
            cavities: master.cavities,
            inferredDie: extractBaseDie(partNumber || sage)
          };
        });
      }, [salesRange, masterPartByPart]);

      // Parse Open Orders (OOR).
      // Actual OOR columns (header row, sheet row 2):
      //   B Promise Date, D Order No, E Order Date, F CSR, G PO,
      //   L Customer Name, M Item Code, O UOM, P Quantity Ordered,
      //   R Profile Die Used, S Profile #, T New PN,
      //   Y Shipped, Z/AA Packaged, AB Bag, AC/AD MCM.
      // The old code read the wrong columns throughout: SO # came from
      // column A (a quantity), customer from the promise date, and qty
      // from column D (the order number) -- which is why the die badges
      // summed order numbers into the millions. Header, subheader and
      // title rows are skipped by requiring a numeric Order No and an
      // Item Code, rather than trusting a row index.
      const openOrdersList = useMemo(() => {
        if (!oorRange?.data) return [];
        const parseQty = (v) => {
          if (v == null) return 0;
          const n = parseFloat(String(v).replace(/,/g, ''));
          return isNaN(n) ? 0 : n;
        };
        return oorRange.data
          .filter(r => r.row && /^\d+$/.test(String(r.row[3] || '').trim()) && r.row[12])
          .map((r, idx) => {
            const soNum = String(r.row[3]).trim();
            const customer = String(r.row[11] || 'Customer').trim();
            const itemPart = String(r.row[12] || r.row[19] || '').trim();
            const qty = parseQty(r.row[15]);
            const uom = String(r.row[14] || 'FEET').trim().toUpperCase();
            const profileDie = String(r.row[17] || r.row[18] || '').trim().toUpperCase()
              || extractBaseDie(itemPart) || 'Standard';
            const orderDate = r.row[4] || '2026-09-15';
            const promiseDate = r.row[1] || '2026-10-15';
            const csr = String(r.row[5] || 'BBB').trim().slice(0, 3).toUpperCase();
            const po = String(r.row[6] || '').trim();
            const statusRaw = [r.row[24], r.row[25], r.row[26], r.row[27], r.row[28], r.row[29]]
              .filter(Boolean).join(' ');

            let status = 'Scheduled';
            if (/shipped/i.test(statusRaw)) status = 'Shipped';
            else if (/packaged/i.test(statusRaw)) status = 'Packaged';
            else if (/boxed/i.test(statusRaw)) status = 'Boxed';
            else if (/hold/i.test(statusRaw)) status = 'On Hold';

            return {
              id: `${r.index_}-${soNum}-${idx}`,
              soNum,
              customer,
              itemPart: itemPart || profileDie,
              qty,
              uom,
              profileDie,
              orderDate: formatRawDate(orderDate),
              promiseDate: formatRawDate(promiseDate),
              promiseDateRaw: promiseDate,
              csr,
              po,
              status
            };
          });
      }, [oorRange]);

      // Parse Rates By Profile.
      // Actual columns: A Profile name, B Profile #, C Lowest Rate (ft/hr),
      // D Recorded Rates (a count, NOT a speed), E Average Rate (ft/hr).
      // inHr is derived (ft/hr x 12) so the existing run-time maths, which
      // works in inches, stays correct.
      const ratesList = useMemo(() => {
        if (!ratesRange?.data) return [];
        return ratesRange.data.filter(r => r.index_ > 0 && r.row && r.row[1]).map(r => {
          const profileDie = String(r.row[1] || '').trim().toUpperCase();
          const lowestRateFtHr = parseFloat(r.row[2]) || null;
          const averageRateFtHr = parseFloat(r.row[4]) || null;
          if (!averageRateFtHr) return null;
          return {
            profileDie,
            profileName: String(r.row[0] || '').trim(),
            lowestRateFtHr,
            averageRateFtHr,
            ftHr: averageRateFtHr,
            inHr: averageRateFtHr * 12
          };
        }).filter(Boolean);
      }, [ratesRange]);

      // Parse Inspection Sheet
      const inspectionLinesList = useMemo(() => {
        if (!inspRange?.data) return [];
        return inspRange.data.filter(r => r.index_ >= 3 && r.row && (r.row[5] || r.row[4] || r.row[2])).map(r => {
          const lineNum = r.row[2] != null ? String(r.row[2]).trim() : '';
          const partNum = r.row[4] ? String(r.row[4]).trim() : '';
          const dieNum = r.row[5] ? String(r.row[5]).trim() : '';
          const resin = r.row[10] != null ? String(r.row[10]).trim() : '';
          const color = r.row[11] != null ? String(r.row[11]).trim() : '';
          const inHr = parseFloat(r.row[14]) || 0;
          const hasResin = Boolean(resin && !['#N/A', 'N/A', '—', '-'].includes(resin.toUpperCase()));
          const hasSpeed = inHr > 0;
          return {
            lineNum,
            partNum,
            dieNum,
            resin,
            color,
            inHr,
            isActive: hasResin && hasSpeed
          };
        });
      }, [inspRange]);

      // Top KPI Badges
      const kpis = useMemo(() => {
        const totalSKUs = inventoryList.length;
        const readyInStock = inventoryList.filter(i => i.qtyAvailable > 0).length;
        const backlogOrders = openOrdersList.length;
        const toolingProfiles = ratesList.length;
        const activeLines = inspectionLinesList.filter(l => l.isActive).length;
        const totalLines = inspectionLinesList.length;
        return { totalSKUs, readyInStock, backlogOrders, toolingProfiles, activeLines, totalLines };
      }, [inventoryList, openOrdersList, ratesList, inspectionLinesList]);

      // Summary list of dies with backlog for OOR tab carousel
      const oorDieSummaries = useMemo(() => {
        const counts = {};
        openOrdersList.forEach(o => {
          const d = o.profileDie || 'Standard';
          if (!counts[d]) counts[d] = { orders: 0, totalQty: 0 };
          counts[d].orders += 1;
          counts[d].totalQty += o.qty;
        });

        const list = Object.keys(counts).map(die => ({
          die,
          orders: counts[die].orders,
          totalQty: counts[die].totalQty
        }));

        list.sort((a, b) => b.orders - a.orders);
        return list;
      }, [openOrdersList]);

      // Filtered OOR Rows, sorted by promise date, earliest first, so the
      // table is in a stable, useful order instead of sheet order.
      const filteredOorOrders = useMemo(() => {
        const parsePromise = (d) => {
          const dt = parseSafeDate(String(d || ''));
          return isNaN(dt.getTime()) ? null : dt;
        };
        return openOrdersList.filter(ord => {
          const matchDie = oorSelectedDie === 'ALL' || ord.profileDie === oorSelectedDie;
          if (!matchDie) return false;

          if (!oorSearchQuery) return true;
          const q = oorSearchQuery.toLowerCase();
          return (
            ord.soNum.toLowerCase().includes(q) ||
            ord.customer.toLowerCase().includes(q) ||
            ord.itemPart.toLowerCase().includes(q) ||
            ord.profileDie.toLowerCase().includes(q) ||
            (ord.po || '').toLowerCase().includes(q)
          );
        }).sort((a, b) => {
          const da = parsePromise(a.promiseDateRaw);
          const db = parsePromise(b.promiseDateRaw);
          if (da && db) return da - db;
          if (da) return -1;
          if (db) return 1;
          return 0;
        });
      }, [openOrdersList, oorSelectedDie, oorSearchQuery]);

      // Default selected SKU for Lead Time tab
      useEffect(() => {
        if (!selectedPartId && inventoryList.length > 0) {
          const pref = inventoryList.find(i => i.partNumber.includes('AG-405')) || inventoryList[0];
          setSelectedPartId(pref.id);
        }
      }, [inventoryList, selectedPartId]);

      const selectedItem = useMemo(() => {
        return inventoryList.find(i => i.id === selectedPartId) || inventoryList[0] || null;
      }, [inventoryList, selectedPartId]);

      // Rate spec for current die. Weight and cavities come from Master
      // Part 2.0 for the selected part, not from RatesByProfile, which does
      // not carry them. A missing rate is flagged, not silently replaced
      // with 219, so a lead time is never quoted off a made-up speed.
      const selectedDieRate = useMemo(() => {
        if (!selectedItem) return null;
        const die = selectedItem.inferredDie.toUpperCase();
        const found = ratesList.find(r => r.profileDie === die) || null;
        return {
          profileDie: die,
          cavities: selectedItem.cavities || 2,
          linearWeight: selectedItem.weightFt || 0.103,
          lowestRateFtHr: found ? found.lowestRateFtHr : null,
          averageRateFtHr: found ? found.averageRateFtHr : null,
          ftHr: found ? found.averageRateFtHr : null,
          inHr: found ? found.averageRateFtHr * 12 : null,
          rateMissing: !found
        };
      }, [selectedItem, ratesList]);

      // Active Orders in Queue for this Die
      const dieQueueOrders = useMemo(() => {
        if (!selectedItem) return [];
        const die = selectedItem.inferredDie.toUpperCase();
        return openOrdersList.filter(o => o.profileDie === die || o.itemPart.toUpperCase().includes(die));
      }, [selectedItem, openOrdersList]);

      // Matching Active Line on plant floor
      const liveInspectionInfo = useMemo(() => {
        if (!selectedItem) return null;
        const die = extractBaseDie(selectedItem.partNumber).toUpperCase();
        const pn = selectedItem.partNumber.toUpperCase();
        return inspectionLinesList.find(l => {
          if (!l.isActive) return false;
          const lDie = extractBaseDie(l.dieNum || l.partNum);
          return lDie === die || (l.partNum && l.partNum.toUpperCase() === pn);
        }) || null;
      }, [selectedItem, inspectionLinesList]);

      // Calculation Engine
      const calc = useMemo(() => {
        if (!selectedItem) return null;
        const available = selectedItem.qtyAvailable || 0;
        const requested = Number(inquiredQty) || 1;
        const asOf = parseSafeDate(quoteAsOfDate);
        const isLive = Boolean(liveInspectionInfo);

        const is100InStock = available >= requested;
        const coveragePct = Math.min(100, Math.round((available / requested) * 100));
        const balanceRemaining = Math.max(0, available - requested);

        const deficitQty = Math.max(0, requested - available);
        const inHr = selectedDieRate ? selectedDieRate.inHr : null;
        // Deficit only: stock already covers the rest, so only the deficit
        // needs extruding. inHr = average ft/hr x 12, so
        // (deficit ft x 12 in/ft) / inHr = deficit / average ft/hr.
        const machineRunHours = inHr ? (deficitQty * 12) / inHr : 0;
        const continuousDays = deficitQty > 0 ? Math.max(1, Math.ceil(machineRunHours / 24)) : 0;
        const batchWeight = Math.round(requested * selectedDieRate.linearWeight);

        const rateMissing = !is100InStock && (!selectedDieRate || selectedDieRate.rateMissing);
        let wholeDaysMin = 1, wholeDaysMax = 2;
        let targetDispatchDate;

        if (rateMissing) {
          wholeDaysMin = null;
          wholeDaysMax = null;
          targetDispatchDate = null;
        } else if (is100InStock) {
          wholeDaysMin = 1;
          wholeDaysMax = isRushOrder ? 1 : 2;
          targetDispatchDate = addBusinessDays(asOf, wholeDaysMax);
        } else if (isLive) {
          const res = addContinuousExtrusionWithFreightPickup(asOf, continuousDays + (isRushOrder ? 1 : 2));
          targetDispatchDate = res.dispatchDate;
          wholeDaysMin = countBusinessDays(asOf, addContinuousExtrusionWithFreightPickup(asOf, continuousDays).dispatchDate);
          wholeDaysMax = countBusinessDays(asOf, targetDispatchDate);
        } else {
          const setupEnd = addBusinessDays(asOf, 10);
          const res = addContinuousExtrusionWithFreightPickup(setupEnd, continuousDays + (isRushOrder ? 1 : 2));
          targetDispatchDate = res.dispatchDate;
          wholeDaysMin = countBusinessDays(asOf, addContinuousExtrusionWithFreightPickup(setupEnd, continuousDays).dispatchDate);
          wholeDaysMax = countBusinessDays(asOf, targetDispatchDate);
        }

        return {
          is100InStock,
          coveragePct,
          balanceRemaining,
          deficitQty,
          rateMissing,
          wholeDaysMin,
          wholeDaysMax,
          targetDispatchDate,
          isLive,
          machineRunHours,
          continuousDays,
          batchWeight
        };
      }, [selectedItem, inquiredQty, quoteAsOfDate, isRushOrder, liveInspectionInfo, selectedDieRate]);

      // Filtered inventory rows for Tab 2
      const filteredInventory = useMemo(() => {
        return inventoryList.filter(item => {
          const matchText = invSearchQuery === '' ||
            item.partNumber.toLowerCase().includes(invSearchQuery.toLowerCase()) ||
            item.description.toLowerCase().includes(invSearchQuery.toLowerCase()) ||
            item.loc1.toLowerCase().includes(invSearchQuery.toLowerCase());
          
          if (!matchText) return false;
          if (invFilterStock === 'instock') return item.qtyAvailable > 0;
          return true;
        });
      }, [inventoryList, invSearchQuery, invFilterStock]);

      if (!authorized) {
        const submitGate = (e) => {
          if (e) e.preventDefault();
          if (gateInput === GATE_PASSWORD) {
            try {
              sessionStorage.setItem(GATE_SESSION_KEY, "ok");
            } catch (err) {
              // Private browsing may block sessionStorage; the session
              // still unlocks in memory for this page load.
            }
            setGateError(false);
            setGateInput("");
            setAuthorized(true);

                          </td>
                          <td className="py-2.5 px-3 text-center text-slate-500 text-[11px]">{row.orderDate}</td>
                          <td className="py-2.5 px-3 text-center font-medium text-slate-800 text-[11px]">{row.promiseDate}</td>
                          <td className="py-2.5 px-3 text-center text-slate-500 text-[10px] font-bold">{row.csr}</td>
                          <td className="py-2.5 px-3 text-center">
                            <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                              row.status === 'Packaged' || row.status === 'Shipped'
                                ? 'bg-emerald-100 text-emerald-800'
                                : row.status === 'Boxed'
                                ? 'bg-blue-100 text-blue-800'
                                : 'bg-amber-100 text-amber-800'
                            }`}>
                              {row.status}
                            </span>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="flex items-center justify-between text-[11px] text-slate-400 pt-1">
                  <span>
                    Showing {Math.min(50, filteredOorOrders.length)} of {filteredOorOrders.length} records
                  </span>
                  <span>Use the Profile Die dropdown above to filter orders</span>
                </div>
              </div>
            ) : (
              /* Fallback for other tabs */
              <div className="bg-white rounded-2xl border border-slate-200 p-8 text-center max-w-2xl mx-auto my-8">
                <div className="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
                  <Layers className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-900 capitalize">{activeTab} View</h3>
                <p className="text-xs text-slate-500 mt-1 max-w-md mx-auto">
                  Live data for this sheet is fully connected from your Google Apps Script backend and synchronizing with your sales lead time calculations.
                </p>
                <button
                  onClick={() => setActiveTab('leadtime')}
                  className="mt-4 px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-semibold hover:bg-blue-700 transition"
                >
                  Return to Lead Time Calculator
                </button>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
