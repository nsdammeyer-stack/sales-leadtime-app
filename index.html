<body class="bg-slate-100/70 text-slate-900 font-sans antialiased min-h-screen">

  <script type="text/babel" data-type="module">
    import React, { useState, useMemo, useEffect } from 'react';
    import ReactDOM from 'react-dom/client';
    import {
      Search, Clock, Calendar, CheckCircle2, AlertTriangle, AlertCircle,
      Package, Truck, Layers, Wrench, Plus, Edit2, Trash2,
      FileText, Sparkles, X, Info, ShieldCheck, MapPin, Flame,
      Gauge, Zap, Activity, ExternalLink, RefreshCw, ChevronRight, Square
    } from 'lucide-react';

    // =========================================================================
    // GOOGLE APPS SCRIPT URL
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzyYSr3-UnFMnUYsxf9oNdG8wJqM4g5W8TO_NfM0s71cJjwZw3RdTUkp5gaBDGLtFsh/exec?action=leadtime";

    // =========================================================================
    // PACKAGING ESTIMATOR — port of the "Packaging Tool" Google Sheet's
    // custom functions (ESTIMATE_PACKING, ESTIMATE_SUGGESTED_BOX,
    // ESTIMATE_DIMS, getMatDimsFromLine, getBestBox). The box list below
    // is that sheet's Settings tab. Verified 2026-10-28: this port
    // reproduces all 6 example rows in the sheet exactly (packing text,
    // suggested box, and dimensions). It runs entirely in the app — no
    // sheet or script call is needed for a calculation.
    // =========================================================================
    const PACKAGING_BOXES = [
      ["8x8x8", 8, 8, 8, 512], ["60x4x4", 60, 4, 4, 960], ["10x10x10", 10, 10, 10, 1000],
      ["12x10x12", 12, 10, 12, 1440], ["60x5x5", 60, 5, 5, 1500], ["12x12x12", 12, 12, 12, 1728],
      ["60x6x6", 60, 6, 6, 2160], ["15x15x10", 15, 15, 10, 2250], ["20x20x6", 20, 20, 6, 2400],
      ["15x15x15", 15, 15, 15, 3375], ["60x8x8", 60, 8, 8, 3840], ["28x28x6", 28, 28, 6, 4704],
      ["60x10x10", 60, 10, 10, 6000], ["24x24x12", 24, 24, 12, 6912], ["20x20x20", 20, 20, 20, 8000],
      ["24x24x24", 24, 24, 24, 13824]
    ];

    // Full Sheet skid limits (Artek Full Sheet Tolerances sheet,
    // "Quantity Per Skid" column): max sheets per skid by thickness.
    // The shop's other two skid rules: no more than 12" of material
    // on a 4" skid (16" combined height), and the ~2000 lb guideline
    // is approximate, so it is shown in the skid weight, not enforced
    // as a splitter — the table quantity governs.
    const FS_SKID_MAX = {
      0.125: 80, 0.188: 52, 0.25: 40, 0.375: 27, 0.44: 20, 0.5: 20,
      0.625: 16, 0.75: 13, 1: 10, 1.25: 8, 1.5: 7, 1.75: 6, 1.875: 5, 2: 5
    };

    // Full Sheet skid table lookup: nearest table value within 0.01",
    // so 0.1875 matches the 0.188 row. Returns {key, max} or null.
    // The key matters for combined skids: two entries that match the
    // same table row share one count cap on a skid.
    function fsTableEntry(thickness) {
      for (var k in FS_SKID_MAX) {
        if (Math.abs(parseFloat(k) - thickness) <= 0.01) return { key: k, max: FS_SKID_MAX[k] };
      }
      return null;
    }

    // Full Sheet skid plan: sheets per skid is the smallest of the
    // table quantity for the thickness (nearest table value within
    // 0.01", so 0.1875 matches the 0.188 row) and the 12" material
    // height cap; unlisted thicknesses use the height cap alone.
    // Skid size follows sheet length (over 96" rides a 4x10 skid,
    // otherwise a 4x8), and the skid's own weight is added to each
    // skid's total, like the crate tare in estimatePacking.
    function estimateSkid(length, width, thickness, qty, totalWeight) {
      if (!qty || qty <= 0 || !thickness || thickness <= 0) return null;
      var sheetWeight = qty > 0 ? totalWeight / qty : 0;
      var tableEntry = fsTableEntry(thickness);
      var tableMax = tableEntry ? tableEntry.max : null;
      var heightCap = Math.floor(12 / thickness);
      var perSkid = Math.max(1, Math.min(tableMax != null ? tableMax : Infinity, heightCap));
      var is10 = length > 96;
      var tare = is10 ? 100 : 85;
      var numSkids = Math.ceil(qty / perSkid);
      // Fill each skid to the max before starting the next one, so an
      // order reads as full skids plus one remainder skid (13/13/13/1),
      // not the same sheets spread evenly across every skid.
      var remaining = qty, lines = [], dims = [];
      for (var i = 0; i < numSkids; i++) {
        var sQty = Math.min(perSkid, remaining);
        remaining -= sQty;
        var sWeight = sQty * sheetWeight + tare;
        var stackH = sQty * thickness;
        lines.push('Skid ' + (i + 1) + ': ' + sQty + (sQty === 1 ? ' sheet (' : ' sheets (') + sWeight.toFixed(1) + ' lbs)');
        dims.push('Skid ' + (i + 1) + ': ' + length.toFixed(2) + '" x ' + width.toFixed(2) + '" x ' + (4 + stackH).toFixed(2) + '"');
      }
      var packing = numSkids + ' Skid' + (numSkids > 1 ? 's' : '') + ' total.\n' + lines.join('\n');
      return { packing: packing, dims: dims.join('\n'), perSkid: perSkid, numSkids: numSkids, tare: tare };
    }

    // Combined skid plan for Full Sheet lines that share a footprint
    // (same length and width): sheets fill each skid greedily in line
    // order while the skid stays within 12" of material and no
    // thickness exceeds its table quantity on that skid. A lone line
    // packs exactly as estimateSkid does, so single-line behavior is
    // unchanged. Weight is shown per skid, not used as a splitter —
    // the ~2000 lb guideline stays approximate, as in estimateSkid.
    function estimateCombinedSkids(length, width, items) {
      var is10 = length > 96;
      var tare = is10 ? 100 : 85;
      var size = is10 ? '4x10' : '4x8';
      var skids = [];
      var cur = null;
      function newSkid() { cur = { parts: [], height: 0, weight: 0, counts: {} }; skids.push(cur); }
      newSkid();
      items.forEach(function (item) {
        var remaining = item.qty;
        while (remaining > 0) {
          var tableEntry = fsTableEntry(item.thickness);
          var countKey = tableEntry ? tableEntry.key : String(item.thickness);
          var countOnSkid = cur.counts[countKey] || 0;
          var roomByHeight = Math.floor((12 - cur.height) / item.thickness + 1e-9);
          var roomByTable = tableEntry ? (tableEntry.max - countOnSkid) : Infinity;
          var take = Math.min(remaining, roomByHeight, roomByTable);
          if (take <= 0) {
            if (cur.parts.length === 0) { take = 1; }
            else { newSkid(); continue; }
          }
          cur.parts.push({ idx: item.idx, thickness: item.thickness, qty: take });
          cur.height += take * item.thickness;
          cur.weight += take * item.sheetWeight;
          cur.counts[countKey] = countOnSkid + take;
          remaining -= take;
        }
      });
      var result = skids.filter(function (s) { return s.parts.length > 0; }).map(function (s) {
        return { parts: s.parts, height: s.height, weight: s.weight, dims: length.toFixed(2) + '" x ' + width.toFixed(2) + '" x ' + (4 + s.height).toFixed(2) + '"' };
      });
      return { size: size, tare: tare, skids: result };
    }

    function estimatePacking(materialType, length, width, height, thickness, diameter, leg1, leg2, qty, totalWeight) {
      if (!qty || qty <= 0) return "";
      var isCrate = (totalWeight > 400), isBox = (!isCrate && length <= 60);
      var maxWeight = isCrate ? (2100 - 140) : (isBox ? 60 : 150);
      var weightPerPiece = totalWeight / qty;
      var minContainers = Math.ceil(totalWeight / maxWeight);
      var mType = (materialType || "").toString().toLowerCase();
      if (isCrate) {
        var cW = 25.0, cH = 23.5, maxP = Infinity;
        if (mType.indexOf("rod") !== -1 || mType.indexOf("tube") !== -1 || mType.indexOf("round") !== -1) {
          var d = parseFloat(diameter) || 1;
          maxP = Math.floor(cW / d) * Math.floor(cH / d);
        } else if (mType.indexOf("angle") !== -1) {
          var l1 = parseFloat(leg1) || 1, t = parseFloat(thickness) || 0;
          var ppc = t > 0 ? Math.floor((cH - l1 - 1.75) / t) + 1 : 1000;
          maxP = Math.floor(cW / l1) * ppc;
        } else if (mType.indexOf("channel") !== -1) {
          var w = parseFloat(width) || 1, h = parseFloat(height) || parseFloat(leg1) || 1, t = parseFloat(thickness) || 0;
          var ppc = t > 0 ? Math.floor((cH - h) / t) + 1 : 1000;
          maxP = Math.floor(cW / w) * ppc;
        } else if (mType.indexOf("flat") !== -1 || mType.indexOf("bar") !== -1) {
          var w = parseFloat(width) || 1, t = parseFloat(thickness) || parseFloat(height) || 1;
          maxP = Math.floor(cW / w) * Math.floor(cH / t);
        }
        if (maxP < 1 || isNaN(maxP)) maxP = 1;
        minContainers = Math.max(minContainers, Math.ceil(qty / maxP));
      }
      if (weightPerPiece > maxWeight) minContainers = qty;
      var baseQty = Math.floor(qty / minContainers), remainder = qty % minContainers, containers = [];
      for (var i = 0; i < minContainers; i++) { containers.push(baseQty + (i < remainder ? 1 : 0)); }
      var containerName = isCrate ? "Crate" : (isBox ? "Box" : "Bag");
      var result = containers.length + " " + (containers.length > 1 ? containerName + (isBox ? "es" : "s") : containerName) + " total.\n";
      var maxWidth = isCrate ? 25.0 : 10.0;
      for (var i = 0; i < containers.length; i++) {
        var cQty = containers[i];
        var rawWeight = cQty * weightPerPiece;
        if (isCrate) rawWeight += 140;
        var cWeight = rawWeight.toFixed(1), counts = [];
        if (mType.indexOf("rod") !== -1 || mType.indexOf("tube") !== -1 || mType.indexOf("round") !== -1) {
          var d = parseFloat(diameter) || 1, maxPerRow = isBox ? Math.ceil(Math.sqrt(cQty)) : Math.max(1, Math.floor(maxWidth / d)), remaining = cQty;
          if (!isBox && !isCrate && cQty <= maxPerRow * 2) { counts.push(Math.ceil(cQty / 2)); counts.push(Math.floor(cQty / 2)); }
          else { while (remaining > 0) { var take = Math.min(remaining, maxPerRow); counts.push(take); remaining -= take; } }
          counts = counts.filter(function (n) { return n > 0; });
          result += containerName + " " + (i + 1) + ": " + cQty + " pcs (" + cWeight + " lbs) - " + counts.length + " rows: " + counts.join(" + ");
        } else if (mType.indexOf("angle") !== -1 || mType.indexOf("flat") !== -1 || mType.indexOf("bar") !== -1 || mType.indexOf("channel") !== -1) {
          var isAngle = mType.indexOf("angle") !== -1, isChannel = mType.indexOf("channel") !== -1;
          var pW = isAngle ? (parseFloat(leg1) || 1) : (parseFloat(width) || 1), t = parseFloat(thickness) || 0, pH = isAngle ? (parseFloat(leg1) || 1) : (isChannel ? (parseFloat(height) || parseFloat(leg1) || 1) : (parseFloat(thickness) || parseFloat(height) || 1));
          var numStacks;
          if (isBox) {
            var bestScore = Infinity, bestStacks = 1;
            for (var s2 = 1; s2 <= cQty; s2++) {
              var pps = Math.ceil(cQty / s2), w = s2 * pW, h = isAngle ? (pH + (pps - 1) * t + 1.75) : (isChannel ? (pH + (pps - 1) * t) : (pps * pH)), score = Math.max(w, h);
              if (score < bestScore) { bestScore = score; bestStacks = s2; }
            }
            numStacks = bestStacks;
          } else { numStacks = Math.max(1, Math.min(Math.max(1, Math.floor(maxWidth / pW)), Math.ceil(cQty / 15))); }
          var baseS = Math.floor(cQty / numStacks), sRem = cQty % numStacks;
          for (var s3 = 0; s3 < numStacks; s3++) { counts.push(baseS + (s3 < sRem ? 1 : 0)); }
          result += containerName + " " + (i + 1) + ": " + cQty + " pcs (" + cWeight + " lbs) - " + counts.length + " stacks: " + counts.join(" + ");
        } else { result += containerName + " " + (i + 1) + ": " + cQty + " pcs (" + cWeight + " lbs)"; }
        if (i < containers.length - 1) result += "\n";
      }
      return result;
    }

    function getMatDimsFromLine(line, materialType, width, height, thickness, diameter, leg1) {
      var mType = (materialType || "").toString().toLowerCase(), D = parseFloat(diameter) || 0, W = parseFloat(width) || 0, H = parseFloat(height) || 0, T = parseFloat(thickness) || 0, L1 = parseFloat(leg1) || 0, matW = 0, matH = 0;
      if (mType.indexOf('rod') !== -1 || mType.indexOf('tube') !== -1 || mType.indexOf('round') !== -1) {
        var rowM = line.match(/rows:\s*([\d\s\+]+)/i);
        if (rowM) { var rC = rowM[1].split('+').map(function (s) { return parseInt(s.trim()); }); matW = rC[0] * D; matH = rC.length * D; }
      } else if (mType.indexOf('angle') !== -1 || mType.indexOf('flat') !== -1 || mType.indexOf('bar') !== -1 || mType.indexOf('channel') !== -1) {
        var stM = line.match(/stacks:\s*([\d\s\+]+)/i);
        if (stM) {
          var sC = stM[1].split('+').map(function (s) { return parseInt(s.trim()); }), maxS = Math.max.apply(null, sC);
          if (mType.indexOf('angle') !== -1) { matW = sC.length * L1; matH = L1 + (maxS - 1) * T + 1.75; }
          else if (mType.indexOf('channel') !== -1) { matW = sC.length * W; matH = (H || L1) + (maxS - 1) * T; }
          else { matW = sC.length * W; matH = maxS * (T || H); }
        }
      }
      return { w: matW, h: matH };
    }

    function getBestBox(reqL, reqW, reqH, settingsData) {
      var reqD = [reqL, reqW, reqH].sort(function (a, b) { return b - a; }), bestB = null, bestV = Infinity;
      if (!settingsData || !Array.isArray(settingsData)) return null;
      for (var i = 0; i < settingsData.length; i++) {
        var row = settingsData[i]; if (!row || !row[0] || row[0] === "Box Name" || row[0] === "") continue;
        var bD = [parseFloat(row[1]), parseFloat(row[2]), parseFloat(row[3])].sort(function (a, b) { return b - a; });
        if (reqD[0] <= bD[0] && reqD[1] <= bD[1] && reqD[2] <= bD[2]) {
          if (parseFloat(row[4]) < bestV) { bestV = parseFloat(row[4]); bestB = row[0]; }
        }
      }
      return bestB;
    }

    function estimateSuggestedBox(materialType, length, width, height, thickness, diameter, leg1, leg2, qty, totalWeight, estimatedPacking, settingsRange) {
      if (!estimatedPacking || typeof estimatedPacking !== 'string') return '';
      var lines = estimatedPacking.split('\n'), results = [], isAny = false;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim(); if (!line || line.indexOf("total") !== -1) continue;
        var labelMatch = line.match(/(Box\s*\d+|Bag\s*\d+|Crate\s*\d+)/i), label = labelMatch ? labelMatch[1] : ("Container " + i);
        var isBox = label.toLowerCase().indexOf('box') !== -1, isCrate = label.toLowerCase().indexOf('crate') !== -1;
        if (isCrate) { results.push(label + ": Crate"); isAny = true; continue; }
        if (!isBox) continue;
        isAny = true;
        var dims = getMatDimsFromLine(line, materialType, width, height, thickness, diameter, leg1);
        var best = getBestBox(length, dims.w, dims.h, settingsRange);
        results.push(label + ": " + (best || "No box fits"));
      }
      return isAny ? results.join('\n') : "N/A";
    }

    function estimateDims(materialType, length, width, height, thickness, diameter, leg1, leg2, qty, totalWeight, estimatedPacking, settingsRange) {
      if (!estimatedPacking || typeof estimatedPacking !== 'string') return '';
      var lines = estimatedPacking.split('\n'), results = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim(); if (!line || line.indexOf("total") !== -1) continue;
        var labelMatch = line.match(/(Box\s*\d+|Bag\s*\d+|Crate\s*\d+)/i), label = labelMatch ? labelMatch[1] : ("Container " + i);
        if (label.toLowerCase().indexOf('crate') !== -1) { results.push(label + ": 125.00\" x 29.00\" x 33.00\""); continue; }
        var dims = getMatDimsFromLine(line, materialType, width, height, thickness, diameter, leg1);
        if (label.toLowerCase().indexOf('box') !== -1) {
          var best = getBestBox(length, dims.w, dims.h, settingsRange);
          results.push(label + ": " + (best || (parseFloat(length).toFixed(2) + '" x ' + dims.w.toFixed(2) + '" x ' + dims.h.toFixed(2) + '"')));
        } else {
          results.push(label + ": " + (parseFloat(length) + 5).toFixed(2) + '" x ' + (dims.w + 1).toFixed(2) + '" x ' + (dims.h + 3).toFixed(2) + '"');
        }
      }
      return results.join('\n');
    }

    // Which boxes the sales team needs to fill in for each material type.
    // Total Weight is required for every type: it picks Crate vs Box vs
    // Bag and sets the weight per piece. Other boxes are dimmed, not
    // cleared, when switching materials.
    const PKG_REQUIRED_FIELDS = {
      'Flat Bar': ['length', 'width', 'thickness', 'qty'],
      'Rod': ['length', 'diameter', 'qty'],
      'Tube': ['length', 'diameter', 'wall', 'qty'],
      'Angle': ['length', 'leg1', 'leg2', 'thickness', 'qty'],
      'Channel': ['length', 'width', 'height', 'thickness', 'qty'],
      'Full Sheet': ['length', 'width', 'thickness', 'qty'],
    };
    const PKG_FIELD_LABELS = {
      length: 'Length', width: 'Width', height: 'Height', thickness: 'Thickness',
      diameter: 'Diameter', wall: 'Wall Thickness', leg1: 'Leg 1', leg2: 'Leg 2', qty: 'Qty', weight: 'Total Weight',
    };

    // Estimated total weight, ported from the Packaging Tool sheet's
    // Total Weight formula: UHMW at 0.0345 lb/in^3 times length times
    // the profile cross-section times quantity. This is a calculated
    // value, not an input — the sheet never asked for a weight either.
    // Tube goes one better than the sheet (whose formula has no tube
    // case): a hollow cross-section from OD and wall thickness, so tube
    // weights are accurate instead of solid-round estimates.
    function estimatePkgWeight(materialType, length, width, height, thickness, diameter, leg1, leg2, qty, wallThickness) {
      if (!qty || qty <= 0 || !length || length <= 0) return 0;
      var area = 0;
      if (materialType === 'Rod') area = Math.PI * Math.pow(diameter / 2, 2);
      else if (materialType === 'Tube') {
        var innerDiameter = diameter - 2 * wallThickness;
        if (innerDiameter < 0) return 0;
        area = Math.PI * (Math.pow(diameter / 2, 2) - Math.pow(innerDiameter / 2, 2));
      }
      else if (materialType === 'Flat Bar') area = width * thickness;
      else if (materialType === 'Full Sheet') area = width * thickness;
      else if (materialType === 'Angle') area = (leg1 + leg2 - thickness) * thickness;
      else if (materialType === 'Channel') area = (width + 2 * height - 2 * thickness) * thickness;
      else return 0;
      if (!(area > 0)) return 0;
      return 0.0345 * length * area * qty;
    }

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [loadError, setLoadError] = useState(null);
      // Background refresh state. A background refresh never sets
      // `loading`, so it never blanks the screen with the spinner, and
      // it never clears the user's selection, quantity or search text.
      const [refreshing, setRefreshing] = useState(false);
      const [refreshError, setRefreshError] = useState(null);
      const [lastUpdated, setLastUpdated] = useState(null);

      const [activeTab, setActiveTab] = useState('leadtime');

      // Inquiry & Calculation States
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedPartId, setSelectedPartId] = useState(null);
      const [inquiredQty, setInquiredQty] = useState('');
      const [customerName, setCustomerName] = useState('');
      const [internalNotes, setInternalNotes] = useState('');
      const [isRushOrder, setIsRushOrder] = useState(false);
      const [calculationRule, setCalculationRule] = useState('auto');
      const [quoteAsOfDate, setQuoteAsOfDate] = useState(() => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
      });

      // Tab 2: Inventory View Filter States
      const [invSearchQuery, setInvSearchQuery] = useState('');
      const [invFilterStock, setInvFilterStock] = useState('all');
      // Inventory shows the first 50 rows by default so the tab stays
      // snappy (6,551 items parsed from Sales 2.0); "Show all" draws the
      // whole filtered list for scrolling, like Open Orders does.
      const [showAllInventory, setShowAllInventory] = useState(false);

      // Tab 3: OOR View Filter States
      const [oorSearchQuery, setOorSearchQuery] = useState('');
      const [oorSelectedDie, setOorSelectedDie] = useState('ALL');
      // Promise-date search for Open Orders: a date picker (exact day)
      // plus the text search also matching promise dates.
      const [oorDateFilter, setOorDateFilter] = useState('');
      const [inspSearchQuery, setInspSearchQuery] = useState('');
      const [inspFilter, setInspFilter] = useState('all');
      const [dailySearchQuery, setDailySearchQuery] = useState('');
      const [dailyDateFilter, setDailyDateFilter] = useState('');
      // Full Sheet calculator tab states: finished-sheet picker (Sales
      // 2.0 FS- rows, EACH) plus the quantity being quoted.
      const [fsSearchQuery, setFsSearchQuery] = useState('');
      const [selectedFsId, setSelectedFsId] = useState(null);
      const [fsQty, setFsQty] = useState(10);
      // Packaging estimator inputs (same columns as the Packaging Tool
      // sheet: material type, dimensions, qty, total weight).
      const [pkgMaterial, setPkgMaterial] = useState('Flat Bar');
      const [pkgLength, setPkgLength] = useState('');
      const [pkgWidth, setPkgWidth] = useState('');
      const [pkgHeight, setPkgHeight] = useState('');
      const [pkgThickness, setPkgThickness] = useState('');
      const [pkgDiameter, setPkgDiameter] = useState('');
      const [pkgWall, setPkgWall] = useState('');
      const [pkgLeg1, setPkgLeg1] = useState('');
      const [pkgLeg2, setPkgLeg2] = useState('');
      const [pkgQty, setPkgQty] = useState('');
      // Order Builder rows: each row is one line item, with the same
      // fields as the single-item Packaging estimator. The tab opens
      // with one row; "Add line item" appends up to 20.
      const [builderRows, setBuilderRows] = useState([
        { id: 1, material: 'Flat Bar', length: '', width: '', height: '', thickness: '', diameter: '', wall: '', leg1: '', leg2: '', qty: '' },
      ]);
      const [builderNextId, setBuilderNextId] = useState(2);
      // Order card modal: set to an order from openOrdersList when its
      // SO number is clicked, anywhere order numbers appear.
      const [selectedOrder, setSelectedOrder] = useState(null);
      // Inventory OOR modal: set to an inventory row when its Qty On
      // Order number is clicked in the Inventory Stock tab.
      const [oorModalItem, setOorModalItem] = useState(null);
      // Note: the OOR table used to hard-cap at 50 rows, and because rows
      // are sorted by promise date earliest first, the 50th row happened
      // to promise 2026-10-23 -- so the tab looked like it stopped at
      // October 23 even though all orders were loaded. It now renders
      // every filtered row so the user just scrolls.

      // Fetch live data from Google Sheets.
      // Initial load: shows the spinner and, on failure, the error screen.
      // Background refresh (manual button or the 30-minute timer): fetches
      // silently and only swaps data in on success. On failure the old
      // data stays on screen and only a small warning is shown.
      const fetchData = (background = false) => {
        if (background) setRefreshing(true);
        else setLoading(true);
        fetch(API_URL, {
          method: 'GET',
          redirect: 'follow',
        })
          .then(res => {
            if (!res.ok) throw new Error("HTTP error " + res.status);
            return res.json();
          })
          .then(json => {
            if (!Array.isArray(json)) {
              throw new Error("Received unexpected response from Google Sheets. Ensure you deployed a 'New Version' in Apps Script.");
            }
            setData(json);
            setLastUpdated(new Date());
            setRefreshError(null);
            setLoading(false);
            setRefreshing(false);
          })
          .catch(err => {
            console.error("Error loading sheet data:", err);
            if (background) {
              setRefreshError(err.toString());
              setRefreshing(false);
            } else {
              setLoadError(err.toString());
              setLoading(false);
            }
          });
      };

      useEffect(() => {
        fetchData();
        // Background refresh every 30 minutes. The timer is cleaned up
        // when the app unmounts, and browsers throttle timers in hidden
        // tabs, so a tab left open in the background will not hammer the
        // endpoint at full rate.
        const timer = setInterval(() => fetchData(true), 30 * 60 * 1000);
        return () => clearInterval(timer);
      }, []);

      // Date & Business Day Helpers
      const parseSafeDate = (dStr) => {
        if (!dStr || typeof dStr !== 'string') return new Date();
        const clean = dStr.split('T')[0].trim();
        const parts = clean.split('-');
        if (parts.length === 3) {
          const y = parseInt(parts[0], 10), m = parseInt(parts[1], 10), d = parseInt(parts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m - 1, d);
        }
        const slashParts = clean.split('/');
        if (slashParts.length === 3) {
          const m = parseInt(slashParts[0], 10), d = parseInt(slashParts[1], 10), y = parseInt(slashParts[2], 10);
          if (!isNaN(y) && !isNaN(m) && !isNaN(d)) return new Date(y, m - 1, d);
        }
        return new Date();
      };

      const formatSafeDate = (d) => {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      };

      const formatRawDate = (dateVal) => {
        if (!dateVal) return '—';
        const str = String(dateVal).split('T')[0].trim();
        const d = parseSafeDate(str);
        if (isNaN(d.getTime())) return str;
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      };

      const addBusinessDays = (startDate, days) => {
        const d = new Date(startDate.getTime());
        let added = 0;
        while (added < days) {
          d.setDate(d.getDate() + 1);
          const day = d.getDay();
          if (day !== 0 && day !== 6) added++;
        }
        return d;
      };

      const countBusinessDays = (startDate, endDate) => {
        if (!startDate || !endDate) return 1;
        let count = 0;
        const cur = new Date(startDate.getTime());
        cur.setHours(0, 0, 0, 0);
        const end = new Date(endDate.getTime());
        end.setHours(0, 0, 0, 0);
        while (cur < end) {
          cur.setDate(cur.getDate() + 1);
          const day = cur.getDay();
          if (day !== 0 && day !== 6) count++;
        }
        return Math.max(1, count);
      };

      const addContinuousExtrusionWithFreightPickup = (startDate, continuousDays) => {
        const d = new Date(startDate.getTime());
        const daysToAdd = Math.max(1, Math.ceil(continuousDays));
        d.setDate(d.getDate() + daysToAdd);
        const dayOfWeek = d.getDay();
        let freightRollDays = 0;
        if (dayOfWeek === 6) { d.setDate(d.getDate() + 2); freightRollDays = 2; }
        else if (dayOfWeek === 0) { d.setDate(d.getDate() + 1); freightRollDays = 1; }
        return { dispatchDate: d, totalCalendarDays: daysToAdd + freightRollDays, freightRollDays };
      };

      // Family code: die + the 3-letter color/resin code that follows it
      // (e.g. RD-138RBK042-120 -> RD-138RBK, AG-405VNL000-120 -> AG-405VNL,
      // PC-379 -> PC-379). This is how "orders calling for a part" are
      // matched in the inventory OOR modal: same die and same color,
      // regardless of cut length or pigment suffix. That is why the
      // RD-138RBK042-120 modal shows the 1.5-inch RD-138RBK042-1.5 order
      // but not the RD-138VBL293 order.
      const extractFamilyCode = (codeStr) => {
        if (!codeStr || typeof codeStr !== 'string') return '';
        const clean = codeStr.trim().toUpperCase();
        const die = extractBaseDie(clean);
        const rest = clean.slice(die.length);
        const colorMatch = rest.match(/^[A-Z]{3}/);
        return colorMatch ? die + colorMatch[0] : die;
      };

      const extractBaseDie = (codeStr) => {
        if (!codeStr || typeof codeStr !== 'string') return '';
        const clean = codeStr.trim().toUpperCase();
        const rdMatch = clean.match(/^(RD-\d{2,4})/i);
        if (rdMatch) return rdMatch[1].toUpperCase();
        const compoundMatch = clean.match(/^([A-Z0-9]{2,5}-\d{2,4}(?:CR|BC|R|S))\b/i);
        if (compoundMatch) return compoundMatch[1].toUpperCase();
        const stdMatch = clean.match(/^([A-Z0-9]{2,5}-\d{2,4})/i);
        if (stdMatch) return stdMatch[1].toUpperCase();
        const prefixMatch = clean.match(/^([A-Z0-9]+-[A-Z0-9]+)/i);
        return prefixMatch ? prefixMatch[1].toUpperCase() : clean.split(/[^A-Z0-9-]/)[0] || clean;
      };

      // Range extraction
      const salesRange = data?.find(d => d.name === 'Sales 2.0') || data?.[0];
      const oorRange = data?.find(d => d.name === 'OOR') || data?.[1];
      const masterPartRange = data?.find(d => d.name === 'Master Part 2.0') || data?.[2];
      const ratesRange = data?.find(d => d.name === 'RatesByProfile') || data?.[3];
      const inspRange = data?.find(d => d.name === 'Inspection Sheet') || data?.[4];
      // Billet Inventory arrives through the same feed: Master Inventory
      // pulls it from the Skiving Record workbook by IMPORTRANGE, so no
      // second endpoint is needed. Missing range = the import or the
      // sheetNames entry is not live yet; the Full Sheet tab degrades
      // to a process-only estimate and says so.
      const billetRange = data?.find(d => d.name === 'Billet Inventory');

      // Master Part 2.0 lookup, keyed by New Part Number (column I).
      // Sales 2.0 has no description column: its column G is "Date of Last
      // Audit", so descriptions, weight and cavities must come from here.
      const masterPartByPart = useMemo(() => {
        const map = {};
        if (!masterPartRange?.data) return map;
        masterPartRange.data.forEach(r => {
          if (!r.row || !r.row[8]) return;
          const key = String(r.row[8]).trim().toUpperCase();
          if (key && !map[key]) {
            map[key] = {
              description: String(r.row[10] || '').trim(),
              weightFt: parseFloat(r.row[5]) || null,
              cavities: parseInt(r.row[17], 10) || null,
              // Master Part 2.0 col N: Profile Die Used. For FS rows
              // this is the billet family (ES-100/150/200 = 1"/1.5"/2"
              // billets); for profiles it is the extrusion die.
              die: String(r.row[13] || '').trim().toUpperCase(),
              // Master Part 2.0: C Color, D Formulation (e.g. NATURAL,
              // VIRGIN -> "Virgin NATURAL" on the order card).
              color: String(r.row[2] || '').trim(),
              formulation: String(r.row[3] || '').trim(),
            };
          }
        });
        return map;
      }, [masterPartRange]);

      // Parse Inventory List (Sales 2.0)
      const inventoryList = useMemo(() => {
        if (!salesRange?.data) return [];
        return salesRange.data.filter(r => r.index_ > 0 && r.row && (r.row[1] || r.row[0])).map(r => {
          const partNumber = String(r.row[1] || '').trim();
          const sage = String(r.row[0] || '').trim();
          const master = masterPartByPart[partNumber.toUpperCase()] || {};
          const desc = master.description || partNumber;
          const lastAudit = r.row[8] ? String(r.row[8]).trim() : '—';
          return {
            id: `${r.index_}-${partNumber}`,
            partNumber: partNumber || sage,
            sage: sage || partNumber,
            description: desc,
            uom: String(r.row[2] || 'FEET').trim().toUpperCase(),
            length: parseFloat(r.row[3]) || 120,
            qtyAvailable: parseFloat(r.row[5]) || 0,
            qtyOnOrder: parseFloat(r.row[4]) || 0,
            loc1: r.row[7] ? String(r.row[7]).trim() : 'None',
            lastAudit: lastAudit !== '' ? lastAudit : '—',
            weightFt: master.weightFt,
            cavities: master.cavities,
            inferredDie: extractBaseDie(partNumber || sage)
          };
        });
      }, [salesRange, masterPartByPart]);

      // Parse Open Orders (OOR).
      // Actual OOR columns (header row, sheet row 2):
      //   B Promise Date, D Order No, E Order Date, F CSR, G PO,
      //   L Customer Name, M Item Code, O UOM, P Quantity Ordered,
      //   R Profile Die Used, S Profile #, T New PN,
      //   Y Shipped, Z/AA Packaged, AB Bag, AC/AD MCM.
      // The old code read the wrong columns throughout: SO # came from
      // column A (a quantity), customer from the promise date, and qty
      // from column D (the order number) -- which is why the die badges
      // summed order numbers into the millions. Header, subheader and
      // title rows are skipped by requiring a numeric Order No and an
      // Item Code, rather than trusting a row index.
      const openOrdersList = useMemo(() => {
        if (!oorRange?.data) return [];
        const parseQty = (v) => {
          if (v == null) return 0;
          const n = parseFloat(String(v).replace(/,/g, ''));
          return isNaN(n) ? 0 : n;
        };
        return oorRange.data
          .filter(r => r.row && /^\d+$/.test(String(r.row[3] || '').trim()) && r.row[12])
          .map((r, idx) => {
            const soNum = String(r.row[3]).trim();
            const customer = String(r.row[11] || 'Customer').trim();
            const itemPart = String(r.row[12] || r.row[19] || '').trim();
            const qty = parseQty(r.row[15]);
            const uom = String(r.row[14] || 'FEET').trim().toUpperCase();
            const profileDie = String(r.row[17] || r.row[18] || '').trim().toUpperCase()
              || extractBaseDie(itemPart) || 'Standard';
            const orderDate = r.row[4] || '2026-09-15';
            const promiseDate = r.row[1] || '2026-10-15';
            const csr = String(r.row[5] || 'BBB').trim().slice(0, 3).toUpperCase();
            const po = String(r.row[6] || '').trim();
            const statusRaw = [r.row[24], r.row[25], r.row[26], r.row[27], r.row[28], r.row[29]]
              .filter(Boolean).join(' ');

            let status = 'Scheduled';
            if (/shipped/i.test(statusRaw)) status = 'Shipped';
            else if (/packaged/i.test(statusRaw)) status = 'Packaged';
            else if (/boxed/i.test(statusRaw)) status = 'Boxed';
            else if (/hold/i.test(statusRaw)) status = 'On Hold';

            // Full detail for the order card. OOR columns: G PO, H Ship
            // Via, I Ship To (multiline), K Customer #, N Description,
            // T New PN, U lbs/in, V FG Length, X Total Weight, C Tracking,
            // Q Lot, AF Pickings. Color/resin comes from Master Part 2.0
            // (formulation + color) looked up by New PN, then item code.
            const familyCode = extractFamilyCode(itemPart)
              || extractFamilyCode(String(r.row[19] || ''));
            const familyMasterKey = Object.keys(masterPartByPart).find(k => k.startsWith(familyCode));
            const master = masterPartByPart[String(r.row[19] || '').trim().toUpperCase()]
              || masterPartByPart[itemPart.toUpperCase()]
              || (familyMasterKey ? masterPartByPart[familyMasterKey] : null) || {};
            const formulation = master.formulation
              ? master.formulation.charAt(0).toUpperCase() + master.formulation.slice(1).toLowerCase()
              : '';
            const colorResin = [formulation, master.color].filter(Boolean).join(' ') || '—';
            const lbsIn = parseFloat(r.row[20]) || null;
            const fgLength = parseFloat(r.row[21]) || null;
            const fulfillment = [r.row[24], r.row[25], r.row[26], r.row[27], r.row[28], r.row[29]]
              .filter(Boolean).join(' • ');
            return {
              id: `${r.index_}-${soNum}-${idx}`,
              soNum,
              familyCode,
              customer,
              account: String(r.row[10] || '').trim(),
              shipVia: String(r.row[7] || '').trim(),
              shipTo: String(r.row[8] || '').trim(),
              description: String(r.row[13] || '').trim(),
              newPartNum: String(r.row[19] || '').trim(),
              itemPart: itemPart || profileDie,
              qty,
              uom,
              profileDie,
              colorResin,
              lbsIn,
              fgLength,
              unitWeight: (lbsIn && fgLength) ? lbsIn * fgLength : null,
              totalWeight: parseFloat(r.row[23]) || null,
              tracking: String(r.row[2] || '').trim(),
              lot: String(r.row[16] || '').trim(),
              pickings: String(r.row[31] || '').trim(),
              fulfillment: fulfillment || '',
              orderDate: formatRawDate(orderDate),
              promiseDate: formatRawDate(promiseDate),
              promiseDateRaw: promiseDate,
              csr,
              po,
              status
            };
          });
      }, [oorRange, masterPartByPart]);

      // Parse Rates By Profile.
      // Actual columns: A Profile name, B Profile #, C Lowest Rate (in/hr),
      // D Recorded Rates (a count, NOT a speed), E Average Rate (in/hr).
      // CORRECTION (2026-10-28): these rates are inches per hour, NOT
      // feet per hour. The old code treated the average as ft/hr and
      // multiplied by 12 to get in/hr, which made every run time 12x too
      // short. inHr is the average itself; ftHr is average / 12.
      const ratesList = useMemo(() => {
        if (!ratesRange?.data) return [];
        return ratesRange.data.filter(r => r.index_ > 0 && r.row && r.row[1]).map(r => {
          const profileDie = String(r.row[1] || '').trim().toUpperCase();
          const lowestRateInHr = parseFloat(r.row[2]) || null;
          const recordedCount = parseInt(r.row[3], 10);
          const averageRateInHr = parseFloat(r.row[4]) || null;
          if (!averageRateInHr) return null;
          return {
            // feedIndex is the row's position in the feed and is unique
            // even when the same die appears more than once. It must be
            // used as a unique row key.
            feedIndex: r.index_,
            profileDie,
            profileName: String(r.row[0] || '').trim(),
            lowestRateInHr,
            recordedCount: isNaN(recordedCount) ? null : recordedCount,
            averageRateInHr,
            ftHr: averageRateInHr / 12,
            inHr: averageRateInHr
          };
        }).filter(Boolean);
      }, [ratesRange]);

      // Parse Inspection Sheet. Columns: C Line #, E Part #, F Die #,
      // K Resin, L Color, O Measured In/Hr, P Target Rate In/Hr.
      // In-line definition (Nathan, 2026-10-28): a line counts as in-line
      // when it has a resin AND a numeric target rate. The old definition
      // required measured In/Hr > 0, but that column is 0 or blank for
      // all 136 rows in the sheet right now, so it counted 0 of 68 lines
      // as in-line even though 46 lines have resin + target rate. This
      // definition also drives liveInspectionInfo below, so a die counted
      // as in-line skips the 10-day setup in lead-time calculations.
      const inspectionLinesList = useMemo(() => {
        if (!inspRange?.data) return [];
        return inspRange.data.filter(r => r.index_ >= 3 && r.row && (r.row[5] || r.row[4] || r.row[2])).map(r => {
          const lineNum = r.row[2] != null ? String(r.row[2]).trim() : '';
          const partNum = r.row[4] ? String(r.row[4]).trim() : '';
          const dieNum = r.row[5] ? String(r.row[5]).trim() : '';
          const resin = r.row[10] != null ? String(r.row[10]).trim() : '';
          const color = r.row[11] != null ? String(r.row[11]).trim() : '';
          const inHr = parseFloat(r.row[14]) || 0;
          const targetRate = parseFloat(r.row[15]) || 0;
          const hasResin = Boolean(resin && !['#N/A', 'N/A', '—', '-'].includes(resin.toUpperCase()));
          const hasSpeed = targetRate > 0;
          return {
            lineNum,
            partNum,
            dieNum,
            resin,
            color,
            desc: r.row[3] ? String(r.row[3]).trim() : '',
            inHr,
            targetRate,
            // Display speed: measured rate when present, else target rate.
            effectiveInHr: inHr > 0 ? inHr : targetRate,
            isActive: hasResin && hasSpeed
          };
        });
      }, [inspRange]);

      // Top KPI Badges
      const kpis = useMemo(() => {
        const totalSKUs = inventoryList.length;
        const readyInStock = inventoryList.filter(i => i.qtyAvailable > 0).length;
        const backlogOrders = openOrdersList.length;
        const activeLines = inspectionLinesList.filter(l => l.isActive).length;
        const totalLines = inspectionLinesList.length;
        return { totalSKUs, readyInStock, backlogOrders, activeLines, totalLines };
      }, [inventoryList, openOrdersList, inspectionLinesList]);

      // Daily Shipments range. NOTE (2026-10-28): the Apps Script
      // action=leadtime feed currently returns only Sales 2.0, OOR,
      // Master Part 2.0, RatesByProfile and Inspection Sheet — it does
      // NOT include Daily Shipments yet. The Daily Shipments tab below
      // looks for a feed entry named exactly "Daily Shipments" and shows
      // an empty-state explaining this until the script is updated and
      // redeployed with that tab added to the leadtime response.
      const dailyRange = data?.find(d => d.name === 'Daily Shipments') || null;

      // Parse Daily Shipments. Header is row 1; data from row 2.
      // Columns: B Promise Date, C Tracking, D Order #, E Order Date,
      // F CSR, G PO, H Ship Via, L Customer Name, M Item Code,
      // N Description, O UOM, P Quantity Ordered, V Profile Die,
      // W Color, AC Weigh in lbs.
      const dailyShipmentsList = useMemo(() => {
        if (!dailyRange?.data) return [];
        return dailyRange.data.filter(r => r.index_ > 0 && r.row && r.row[3]).map(r => {
          const promiseDateRaw = String(r.row[1] || '').trim();
          const qty = parseFloat(String(r.row[15] || '').replace(/,/g, '')) || 0;
          const weight = parseFloat(String(r.row[28] || '').replace(/,/g, '')) || null;
          return {
            // Feed row index makes the key unique: the same SO + item
            // pair occurs more than once in Daily Shipments.
            id: `${r.index_}-${r.row[3]}-${r.row[12]}`,
            promiseDate: formatRawDate(promiseDateRaw),
            promiseDateRaw,
            tracking: String(r.row[2] || '').trim(),
            soNum: String(r.row[3] || '').trim(),
            orderDate: formatRawDate(String(r.row[4] || '').trim()),
            csr: String(r.row[5] || '').trim().toUpperCase(),
            po: String(r.row[6] || '').trim(),
            shipVia: String(r.row[7] || '').trim(),
            customer: String(r.row[11] || '').trim(),
            itemPart: String(r.row[12] || '').trim(),
            description: String(r.row[13] || '').trim(),
            uom: String(r.row[14] || '').trim(),
            qty,
            profileDie: String(r.row[21] || '').trim(),
            color: String(r.row[22] || '').trim(),
            weight
          };
        });
      }, [dailyRange]);

      // Filtered lists for the Inspection and Daily Shipments tabs.
      // Daily shipments are shown newest promise date first (they
      // are shipped history); the OOR tab keeps earliest promise first.
      const filteredInspectionLines = useMemo(() => {
        const q = inspSearchQuery.trim().toLowerCase();
        return inspectionLinesList.filter(l => {
          if (inspFilter === 'inline' && !l.isActive) return false;
          if (!q) return true;
          return (
            String(l.lineNum).toLowerCase().includes(q) ||
            l.partNum.toLowerCase().includes(q) ||
            l.dieNum.toLowerCase().includes(q) ||
            l.resin.toLowerCase().includes(q) ||
            l.color.toLowerCase().includes(q)
          );
        }).sort((a, b) => (parseInt(a.lineNum, 10) || 0) - (parseInt(b.lineNum, 10) || 0));
      }, [inspectionLinesList, inspSearchQuery, inspFilter]);

      const filteredDailyShipments = useMemo(() => {
        const parsePromise = (dStr) => {
          const dt = parseSafeDate(String(dStr || ''));
          return isNaN(dt.getTime()) ? null : dt;
        };
        return dailyShipmentsList.filter(row => {
          if (dailyDateFilter) {
            const dt = parseSafeDate(String(row.promiseDateRaw || ''));
            const ymd = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
            if (ymd !== dailyDateFilter) return false;
          }
          if (!dailySearchQuery) return true;
          const q = dailySearchQuery.toLowerCase();
          return (
            row.soNum.toLowerCase().includes(q) ||
            row.customer.toLowerCase().includes(q) ||
            row.itemPart.toLowerCase().includes(q) ||
            row.tracking.toLowerCase().includes(q) ||
            row.shipVia.toLowerCase().includes(q) ||
            (row.po || '').toLowerCase().includes(q) ||
            row.promiseDate.toLowerCase().includes(q) ||
            String(row.promiseDateRaw || '').toLowerCase().includes(q)
          );
        }).sort((a, b) => {
          const da = parsePromise(a.promiseDateRaw);
          const db = parsePromise(b.promiseDateRaw);
          if (da && db) return db - da;
          if (da) return -1;
          if (db) return 1;
          return 0;
        });
      }, [dailyShipmentsList, dailySearchQuery, dailyDateFilter]);

      // Packaging estimator result: recomputed live as the form changes,
      // the way the sheet's formulas recalculate. Package type follows
      // the sheet's language: over 400 lbs is a Crate, otherwise length
      // 60" or under is a Box, otherwise a Poly Bag. Nothing is shown
      // until every box required for the selected material is filled in,
      // so a defaulted dimension can never silently stand in for a real one.
      const pkgRequired = PKG_REQUIRED_FIELDS[pkgMaterial] || [];
      const pkgValues = { length: pkgLength, width: pkgWidth, height: pkgHeight, thickness: pkgThickness, diameter: pkgDiameter, wall: pkgWall, leg1: pkgLeg1, leg2: pkgLeg2, qty: pkgQty };
      const pkgMissing = pkgRequired.filter((k) => {
        const v = pkgValues[k];
        const n = parseFloat(v);
        return v === '' || v == null || isNaN(n) || n <= 0;
      });
      const pkgFields = [
        { key: 'length', label: 'Length (in)', placeholder: '120', value: pkgLength, set: setPkgLength },
        { key: 'width', label: 'Width (in)', placeholder: pkgMaterial === 'Full Sheet' ? '48' : '2', value: pkgWidth, set: setPkgWidth },
        { key: 'height', label: 'Height (in)', placeholder: '1', value: pkgHeight, set: setPkgHeight },
        { key: 'thickness', label: 'Thickness (in)', placeholder: '0.5', value: pkgThickness, set: setPkgThickness },
        { key: 'diameter', label: 'Diameter (in)', placeholder: '1', value: pkgDiameter, set: setPkgDiameter },
        { key: 'wall', label: 'Wall Thickness (in)', placeholder: '0.25', value: pkgWall, set: setPkgWall },
        { key: 'leg1', label: 'Leg 1 (in)', placeholder: '3', value: pkgLeg1, set: setPkgLeg1 },
        { key: 'leg2', label: 'Leg 2 (in)', placeholder: '3', value: pkgLeg2, set: setPkgLeg2 },
        { key: 'qty', label: 'Qty (pcs)', placeholder: '20', value: pkgQty, set: setPkgQty },
      ];
      const pkgNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
      const pkgTubeWallInvalid = pkgMaterial === 'Tube' && pkgNum(pkgDiameter) > 0 && pkgNum(pkgWall) > 0 && pkgNum(pkgWall) >= pkgNum(pkgDiameter) / 2;
      const pkgResult = useMemo(() => {
        if (pkgMissing.length > 0 || pkgTubeWallInvalid) return null;
        const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
        const length = num(pkgLength), qty = num(pkgQty);
        const weight = estimatePkgWeight(pkgMaterial, length, num(pkgWidth), num(pkgHeight), num(pkgThickness), num(pkgDiameter), num(pkgLeg1), num(pkgLeg2), qty, num(pkgWall));
        if (!qty || qty <= 0 || !weight || weight <= 0 || !length || length <= 0) return null;
        if (pkgMaterial === 'Full Sheet') {
          const skid = estimateSkid(length, num(pkgWidth), num(pkgThickness), qty, weight);
          if (!skid) return null;
          return { packing: skid.packing, suggested: 'N/A', dims: skid.dims, containerType: 'Skid', weight };
        }
        const packing = estimatePacking(pkgMaterial, length, num(pkgWidth), num(pkgHeight), num(pkgThickness), num(pkgDiameter), num(pkgLeg1), num(pkgLeg2), qty, weight);
        if (!packing) return null;
        const suggested = estimateSuggestedBox(pkgMaterial, length, num(pkgWidth), num(pkgHeight), num(pkgThickness), num(pkgDiameter), num(pkgLeg1), num(pkgLeg2), qty, weight, packing, PACKAGING_BOXES);
        const dims = estimateDims(pkgMaterial, length, num(pkgWidth), num(pkgHeight), num(pkgThickness), num(pkgDiameter), num(pkgLeg1), num(pkgLeg2), qty, weight, packing, PACKAGING_BOXES);
        const containerType = weight > 400 ? 'Crate' : (length <= 60 ? 'Box' : 'Poly Bag');
        return { packing, suggested, dims, containerType, weight };
      }, [pkgMaterial, pkgLength, pkgWidth, pkgHeight, pkgThickness, pkgDiameter, pkgWall, pkgLeg1, pkgLeg2, pkgQty]);

      // Order Builder: each row packs with the same functions as the
      // single-item estimator, except Full Sheet lines of the same
      // footprint (length and width) share skids through
      // estimateCombinedSkids; other container types still pack per
      // line (combining lines into shared crates, boxes, or bags is a
      // later step). Container counts for Crate/Box/Bag come from the
      // first line of the packing text ("N Crates total.") rather
      // than a second copy of the container-count math. Shipped
      // weight adds tare per container (crate 140, skid 100/85);
      // boxes and bags have no tare. Rows with missing boxes or an
      // invalid tube wall are left out of the totals until they are
      // filled in.
      const builderResults = useMemo(() => {
        const num = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
        const lines = builderRows.map((row, idx) => {
          const required = PKG_REQUIRED_FIELDS[row.material] || [];
          const values = { length: row.length, width: row.width, height: row.height, thickness: row.thickness, diameter: row.diameter, wall: row.wall, leg1: row.leg1, leg2: row.leg2, qty: row.qty };
          const missing = required.filter((k) => {
            const v = values[k];
            const n = parseFloat(v);
            return v === '' || v == null || isNaN(n) || n <= 0;
          });
          const length = num(row.length), qty = num(row.qty);
          const wallInvalid = row.material === 'Tube' && num(row.diameter) > 0 && num(row.wall) > 0 && num(row.wall) >= num(row.diameter) / 2;
          if (missing.length > 0 || wallInvalid) return { row, idx, missing, wallInvalid, result: null };
          const weight = estimatePkgWeight(row.material, length, num(row.width), num(row.height), num(row.thickness), num(row.diameter), num(row.leg1), num(row.leg2), qty, num(row.wall));
          if (!qty || qty <= 0 || !weight || weight <= 0 || !length || length <= 0) return { row, idx, missing, wallInvalid, result: null };
          if (row.material === 'Full Sheet') {
            return { row, idx, missing, wallInvalid, result: null, fsInfo: { length, width: num(row.width), thickness: num(row.thickness), qty, sheetWeight: qty > 0 ? weight / qty : 0, weight } };
          }
          const packing = estimatePacking(row.material, length, num(row.width), num(row.height), num(row.thickness), num(row.diameter), num(row.leg1), num(row.leg2), qty, weight);
          if (!packing) return { row, idx, missing, wallInvalid, result: null };
          const suggested = estimateSuggestedBox(row.material, length, num(row.width), num(row.height), num(row.thickness), num(row.diameter), num(row.leg1), num(row.leg2), qty, weight, packing, PACKAGING_BOXES);
          const dims = estimateDims(row.material, length, num(row.width), num(row.height), num(row.thickness), num(row.diameter), num(row.leg1), num(row.leg2), qty, weight, packing, PACKAGING_BOXES);
          const containerType = weight > 400 ? 'Crate' : (length <= 60 ? 'Box' : 'Poly Bag');
          const head = packing.match(/^(\d+) (Crate|Box|Bag)(?:es|s)? total\./);
          const count = head ? parseInt(head[1], 10) : 1;
          const typeKey = containerType === 'Poly Bag' ? 'Bag' : containerType;
          const shipped = containerType === 'Crate' ? weight + 140 * count : weight;
          return { row, idx, missing, wallInvalid, result: { packing, suggested, dims, containerType, weight, shipped, counts: { [typeKey]: count } } };
        });
        // Full Sheet lines of the same footprint share skids: group
        // them, pack each group greedily, then fill in each row's
        // packing and dims from the skids its sheets land on.
        const fsGroups = {};
        const fsOrder = [];
        lines.forEach((l) => {
          if (!l.fsInfo) return;
          const key = l.fsInfo.length + 'x' + l.fsInfo.width;
          if (!fsGroups[key]) { fsGroups[key] = { length: l.fsInfo.length, width: l.fsInfo.width, items: [] }; fsOrder.push(key); }
          fsGroups[key].items.push({ idx: l.idx, thickness: l.fsInfo.thickness, qty: l.fsInfo.qty, sheetWeight: l.fsInfo.sheetWeight });
        });
        const skidPlan = [];
        let skidNum = 0;
        fsOrder.forEach((key) => {
          const g = fsGroups[key];
          const plan = estimateCombinedSkids(g.length, g.width, g.items);
          plan.skids.forEach((s) => {
            skidNum += 1;
            skidPlan.push({ number: skidNum, size: plan.size, tare: plan.tare, length: g.length, width: g.width, parts: s.parts, height: s.height, weight: s.weight, dims: s.dims, totalHeight: 4 + s.height });
          });
        });
        lines.forEach((l) => {
          if (!l.fsInfo) return;
          const mine = skidPlan.filter((s) => s.parts.some((p) => p.idx === l.idx));
          const packing = mine.map((s) => {
            const part = s.parts.find((p) => p.idx === l.idx);
            const others = s.parts.filter((p) => p.idx !== l.idx).map((p) => 'Line ' + (p.idx + 1));
            const shared = others.length > 0 ? ' (shared with ' + others.join(', ') + ')' : '';
            return 'Skid ' + s.number + ': ' + part.qty + (part.qty === 1 ? ' sheet ' : ' sheets ') + part.thickness + '"' + shared;
          }).join('\n');
          const dims = mine.map((s) => 'Skid ' + s.number + ': ' + s.dims).join('\n');
          l.result = { packing, suggested: 'N/A', dims, containerType: 'Skid', weight: l.fsInfo.weight };
        });
        const complete = lines.filter((l) => l.result);
        const totals = { material: 0, shipped: 0, crates: 0, boxes: 0, bags: 0, skids: 0 };
        complete.forEach((l) => {
          totals.material += l.result.weight;
          if (l.fsInfo) return;
          totals.shipped += l.result.shipped;
          totals.crates += l.result.counts.Crate || 0;
          totals.boxes += l.result.counts.Box || 0;
          totals.bags += l.result.counts.Bag || 0;
        });
        skidPlan.forEach((s) => {
          totals.shipped += s.weight + s.tare;
          totals.skids += 1;
        });
        return { lines, completeCount: complete.length, totals, skidPlan };
      }, [builderRows]);
      const updateBuilderRow = (id, key, value) => {
        setBuilderRows((rows) => rows.map((r) => (r.id === id ? { ...r, [key]: value } : r)));
      };
      const addBuilderRow = () => {
        if (builderRows.length >= 20) return;
        setBuilderRows((rows) => [...rows, { id: builderNextId, material: 'Flat Bar', length: '', width: '', height: '', thickness: '', diameter: '', wall: '', leg1: '', leg2: '', qty: '' }]);
        setBuilderNextId((n) => n + 1);
      };
      const removeBuilderRow = (id) => {
        setBuilderRows((rows) => rows.filter((r) => r.id !== id));
      };

      // Summary list of dies with backlog for OOR tab carousel
      const oorDieSummaries = useMemo(() => {
        const counts = {};
        openOrdersList.forEach(o => {
          const d = o.profileDie || 'Standard';
          if (!counts[d]) counts[d] = { orders: 0, totalQty: 0 };
          counts[d].orders += 1;
          counts[d].totalQty += o.qty;
        });

        const list = Object.keys(counts).map(die => ({
          die,
          orders: counts[die].orders,
          totalQty: counts[die].totalQty
        }));

        list.sort((a, b) => b.orders - a.orders);
        return list;
      }, [openOrdersList]);

      // Filtered OOR Rows, sorted by promise date, earliest first, so the
      // table is in a stable, useful order instead of sheet order.
      const filteredOorOrders = useMemo(() => {
        const parsePromise = (d) => {
          const dt = parseSafeDate(String(d || ''));
          return isNaN(dt.getTime()) ? null : dt;
        };
        return openOrdersList.filter(ord => {
          const matchDie = oorSelectedDie === 'ALL' || ord.profileDie === oorSelectedDie;
          if (!matchDie) return false;

          // Exact-day date picker. Dates are compared as local YYYY-MM-DD
          // (not UTC ISO) so a date never shifts by timezone.
          if (oorDateFilter) {
            const dt = parseSafeDate(String(ord.promiseDateRaw || ''));
            const ymd = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
            if (ymd !== oorDateFilter) return false;
          }

          if (!oorSearchQuery) return true;
          const q = oorSearchQuery.toLowerCase();
          return (
            ord.soNum.toLowerCase().includes(q) ||
            ord.customer.toLowerCase().includes(q) ||
            ord.itemPart.toLowerCase().includes(q) ||
            ord.profileDie.toLowerCase().includes(q) ||
            (ord.po || '').toLowerCase().includes(q) ||
            // Promise-date search by text: formatted ("Nov 2, 2026") or
            // raw ("11/2/2026", "2026-11-02") promise date.
            ord.promiseDate.toLowerCase().includes(q) ||
            String(ord.promiseDateRaw || '').toLowerCase().includes(q)
          );
        }).sort((a, b) => {
          const da = parsePromise(a.promiseDateRaw);
          const db = parsePromise(b.promiseDateRaw);
          if (da && db) return da - db;
          if (da) return -1;
          if (db) return 1;
          return 0;
        });
      }, [openOrdersList, oorSelectedDie, oorSearchQuery, oorDateFilter]);

      // Orders calling for the inventory item in the OOR modal: same
      // family code (die + color), or an exact part-number match.
      const oorOrdersForItem = useMemo(() => {
        if (!oorModalItem) return [];
        const family = extractFamilyCode(oorModalItem.partNumber);
        const pn = oorModalItem.partNumber.toUpperCase();
        return openOrdersList.filter(o =>
          o.familyCode === family
          || o.newPartNum.toUpperCase() === pn
          || o.itemPart.toUpperCase() === pn);
      }, [oorModalItem, openOrdersList]);

      // Default selected SKU for Lead Time tab
      useEffect(() => {
        if (!selectedPartId && inventoryList.length > 0) {
          const pref = inventoryList.find(i => i.partNumber.includes('AG-405')) || inventoryList[0];
          setSelectedPartId(pref.id);
        }
      }, [inventoryList, selectedPartId]);

      const selectedItem = useMemo(() => {
        return inventoryList.find(i => i.id === selectedPartId) || inventoryList[0] || null;
      }, [inventoryList, selectedPartId]);

      // Rate spec for current die. Weight and cavities come from Master
      // Part 2.0 for the selected part, not from RatesByProfile, which does
      // not carry them. A missing rate is flagged, not silently replaced
      // with 219, so a lead time is never quoted off a made-up speed.
      const selectedDieRate = useMemo(() => {
        if (!selectedItem) return null;
        const die = selectedItem.inferredDie.toUpperCase();
        const found = ratesList.find(r => r.profileDie === die) || null;
        return {
          profileDie: die,
          cavities: selectedItem.cavities || 2,
          linearWeight: selectedItem.weightFt || 0.103,
          lowestRateInHr: found ? found.lowestRateInHr : null,
          averageRateInHr: found ? found.averageRateInHr : null,
          ftHr: found ? found.averageRateInHr / 12 : null,
          inHr: found ? found.averageRateInHr : null,
          rateMissing: !found
        };
      }, [selectedItem, ratesList]);

      // Active Orders in Queue for this Die
      const dieQueueOrders = useMemo(() => {
        if (!selectedItem) return [];
        const die = selectedItem.inferredDie.toUpperCase();
        return openOrdersList.filter(o => o.profileDie === die || o.itemPart.toUpperCase().includes(die));
      }, [selectedItem, openOrdersList]);

      // Matching Active Line on plant floor
      const liveInspectionInfo = useMemo(() => {
        if (!selectedItem) return null;
        const die = extractBaseDie(selectedItem.partNumber).toUpperCase();
        const pn = selectedItem.partNumber.toUpperCase();
        return inspectionLinesList.find(l => {
          if (!l.isActive) return false;
          const lDie = extractBaseDie(l.dieNum || l.partNum);
          return lDie === die || (l.partNum && l.partNum.toUpperCase() === pn);
        }) || null;
      }, [selectedItem, inspectionLinesList]);

      // Calculation Engine
      const calc = useMemo(() => {
        if (!selectedItem) return null;
        const requested = Number(inquiredQty);
        if (!requested || requested <= 0) return null;
        const available = selectedItem.qtyAvailable || 0;
        const asOf = parseSafeDate(quoteAsOfDate);
        const isLive = Boolean(liveInspectionInfo);

        const is100InStock = available >= requested;
        const coveragePct = Math.min(100, Math.round((available / requested) * 100));
        const balanceRemaining = Math.max(0, available - requested);

        const deficitQty = Math.max(0, requested - available);
        const inHr = selectedDieRate ? selectedDieRate.inHr : null;
        // Run time covers the deficit PLUS the die queue already in OOR:
        // those orders run before this one on the same die, so their run
        // time delays this order too. inHr is the RatesByProfile average
        // in inches per hour, so run hours = qty ft x 12 in/ft / inHr.
        // Queue qty is summed as-is from OOR (the same total the queue
        // table shows); it does not apply when the order is 100% in
        // stock, because then nothing needs to run at all. One
        // exception: this SKU's own on-order qty is excluded from the
        // run-time queue, because those units are already produced and
        // sitting in physical stock — that is exactly why Sales
        // "available" is net of "qty on order" (proven 2026-10-28).
        // Charging them as machine time again would double-count them,
        // the same bug the Full Sheet tab had with stock. The deficit,
        // coverage, and balance figures above stay net-based and are
        // already correct; only the machine-time queue changes.
        const queueQty = dieQueueOrders.reduce((sum, o) => sum + (o.qty || 0), 0);
        const queueQtyForRun = Math.max(0, queueQty - (selectedItem.qtyOnOrder || 0));
        const queueRunHours = inHr ? (queueQtyForRun * 12) / inHr : 0;
        const totalRunQty = deficitQty + queueQtyForRun;
        const machineRunHours = inHr ? (totalRunQty * 12) / inHr : 0;
        const continuousDays = deficitQty > 0 ? Math.max(1, Math.ceil(machineRunHours / 24)) : 0;
        const batchWeight = Math.round(requested * selectedDieRate.linearWeight);

        const rateMissing = !is100InStock && (!selectedDieRate || selectedDieRate.rateMissing);
        let wholeDaysMin = 1, wholeDaysMax = 2;
        let targetDispatchDate;

        if (rateMissing) {
          wholeDaysMin = null;
          wholeDaysMax = null;
          targetDispatchDate = null;
        } else if (is100InStock) {
          wholeDaysMin = 1;
          wholeDaysMax = isRushOrder ? 1 : 2;
          targetDispatchDate = addBusinessDays(asOf, wholeDaysMax);
        } else if (isLive) {
          const res = addContinuousExtrusionWithFreightPickup(asOf, continuousDays + (isRushOrder ? 1 : 2));
          targetDispatchDate = res.dispatchDate;
          wholeDaysMin = countBusinessDays(asOf, addContinuousExtrusionWithFreightPickup(asOf, continuousDays).dispatchDate);
          wholeDaysMax = countBusinessDays(asOf, targetDispatchDate);
        } else {
          const setupEnd = addBusinessDays(asOf, 10);
          const res = addContinuousExtrusionWithFreightPickup(setupEnd, continuousDays + (isRushOrder ? 1 : 2));
          targetDispatchDate = res.dispatchDate;
          wholeDaysMin = countBusinessDays(asOf, addContinuousExtrusionWithFreightPickup(setupEnd, continuousDays).dispatchDate);
          wholeDaysMax = countBusinessDays(asOf, targetDispatchDate);
        }

        return {
          is100InStock,
          coveragePct,
          balanceRemaining,
          deficitQty,
          queueQty,
          queueQtyForRun,
          queueRunHours,
          rateMissing,
          wholeDaysMin,
          wholeDaysMax,
          targetDispatchDate,
          isLive,
          machineRunHours,
          continuousDays,
          batchWeight
        };
      }, [selectedItem, inquiredQty, quoteAsOfDate, isRushOrder, liveInspectionInfo, selectedDieRate, dieQueueOrders]);

      // =============== FULL SHEET CALCULATOR ===============
      // Finished sheet stock comes from Sales 2.0 (FS- rows, EACH).
      // Billet stock comes from the Billet Inventory feed range.
      // Process rule (Nathan 2026-10-28): when sheets must come out
      // of billets, allow 14 days for skive -> 2 days curtain room ->
      // square at the panel saw -> plane. Extrusion days for a billet
      // shortfall sit on top of the 14 days; finished-stock cover
      // stays 1-2 business days. The 14 days is a fixed pipeline
      // allowance, not scaled by quantity.
      const FS_PROCESS_DAYS = 14;
      // Extrusion rates come from RatesByProfile (Nathan, 2026-10-28),
      // replacing the old Weekly-projection lbs/day defaults AND the
      // 1.12 billet yield factor. RatesByProfile carries the
      // full-sheet dies (ES-101/102/103/104/112/113 = 1", ES-150 =
      // 1.5", ES-200 = 2") with measured average in/hr rates; the
      // family rate is the mean of its dies' averages. Like the
      // profile tab, extrusion days = total billet inches / in/hr /
      // 24 hours of continuous running.
      const fsRateByFamily = useMemo(() => {
        const sums = {};
        ratesList.forEach(r => {
          const die = r.profileDie;
          if (!die.startsWith('ES-')) return;
          const fam = die === 'ES-150' ? '1.5' : die === 'ES-200' ? '2' : '1';
          if (!sums[fam]) sums[fam] = { total: 0, count: 0 };
          sums[fam].total += r.averageRateInHr;
          sums[fam].count += 1;
        });
        const out = {};
        Object.keys(sums).forEach(fam => { out[fam] = sums[fam].total / sums[fam].count; });
        return out;
      }, [ratesList]);
      // Billet sizes arrive as e.g. 1"x10' RBK, 1.5"x10' OFVGY, or the
      // odd 1'x10' VRD (single quote for inches). Normalize all of
      // them to "thickness x lengthFt COLOR" so sheet-side keys match.
      const normalizeBilletType = (sizeStr) => {
        if (!sizeStr || typeof sizeStr !== 'string') return null;
        const cleaned = sizeStr.replace(/["']/g, '').trim().toUpperCase();
        const m = cleaned.match(/^([\d.]+)\s*X\s*(\d+)\s+(.+)$/);
        if (!m) return null;
        return { thickness: m[1], lengthFt: m[2], color: m[3].trim(), key: `${m[1]}x${m[2]} ${m[3].trim()}` };
      };
      // Billet stock by normalized type. The "Total Billets by Type"
      // rollup (cols G:H) wins where present; detail sums (col C size,
      // col E qty) cover any type the rollup missed. Blank import rows
      // are skipped, so a half-loaded IMPORTRANGE cannot poison the map.
      const billetByType = useMemo(() => {
        const detail = {};
        const rollup = {};
        if (!billetRange?.data) return {};
        billetRange.data.forEach(r => {
          if (!r.row) return;
          const size = normalizeBilletType(String(r.row[2] || ''));
          const qty = parseFloat(r.row[4]);
          if (size && !isNaN(qty)) detail[size.key] = (detail[size.key] || 0) + qty;
          const roll = normalizeBilletType(String(r.row[6] || ''));
          const total = parseFloat(r.row[7]);
          if (roll && !isNaN(total)) rollup[roll.key] = total;
        });
        return { ...detail, ...rollup };
      }, [billetRange]);
      const billetFeedMissing = !billetRange?.data;
      // Full-sheet lines currently running, from the same Inspection
      // Sheet feed the profile tab uses. Nathan (2026-10-28) confirmed
      // the Inspection Sheet is current, so it is trusted as the
      // line-status source. A line counts when its die is a full-sheet
      // die (ES-*) with a resin and a numeric target rate — the same
      // in-line definition as profiles. The match is deliberately
      // loose: any line running the same billet family + color counts,
      // not a specific billet number (ES-101/102/103/104/112 are all
      // 1" VNL lines, for example). Sheets under 1" come out of the
      // 1" billet, 1.25" out of the 1.5" billet, and so on — which
      // Master Part's ES-100/150/200 die already encodes per SKU.
      const FS_TURNOVER_DAYS = 2;
      const fsRunningLines = useMemo(() => {
        const seen = new Set();
        return inspectionLinesList.filter(l => l.dieNum.toUpperCase().startsWith('ES-') && l.isActive).map(l => {
          const die = l.dieNum.toUpperCase();
          const billetThickness = die === 'ES-150' ? '1.5' : die === 'ES-200' ? '2' : '1';
          const colorLetters = l.color.replace(/[^A-Z]/gi, '').toUpperCase();
          const lineMatch = (l.desc || '').match(/\(Line\s*(\d+)\)/i);
          return { billetThickness, colorLetters, lineLabel: lineMatch ? `Line ${lineMatch[1]}` : die, die, partNum: l.partNum, targetRate: l.targetRate };
        }).filter(l => {
          const key = `${l.billetThickness}|${l.colorLetters}|${l.lineLabel}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }, [inspectionLinesList]);
      // FS part numbers look like FS-012RBK042-120: thickness code,
      // color letters, 3-digit pigment, dash, length inches (S/CT
      // suffixes are variants of the same sheet). The thickness code
      // is only needed for queue matching, so no inches conversion.
      const FS_PART_RE = /^FS-(\d{3})([A-Z]+)\d{3}-(\d+)/i;
      const fsList = useMemo(() => {
        return inventoryList.filter(i => i.partNumber.toUpperCase().startsWith('FS-')).map(i => {
          const master = masterPartByPart[i.partNumber.toUpperCase()] || {};
          const m = i.partNumber.match(FS_PART_RE);
          const thicknessCode = m ? m[1] : '';
          const colorCode = m ? m[2].toUpperCase() : '';
          const lengthIn = m ? parseInt(m[3], 10) : (i.length || 120);
          const lengthFt = lengthIn >= 110 ? 10 : 8;
          const dieRaw = (master.die || '').toUpperCase();
          const billetThickness = dieRaw === 'ES-100' ? '1' : dieRaw === 'ES-150' ? '1.5' : dieRaw === 'ES-200' ? '2' : null;
          return {
            ...i,
            thicknessCode, colorCode, lengthIn, lengthFt,
            dieFamily: dieRaw || '—',
            billetThickness,
            billetKey: billetThickness ? `${billetThickness}x${lengthFt} ${colorCode}` : null,
            // Master Part col F for FS rows is lbs per SHEET (25 for a
            // 10-foot 1/8" sheet, 20 for the 8-foot), not lbs/ft.
            weightEach: master.weightFt != null ? master.weightFt : null,
          };
        });
      }, [inventoryList, masterPartByPart]);
      const selectedFs = useMemo(() => fsList.find(i => i.id === selectedFsId) || null, [fsList, selectedFsId]);
      // OOR length encodings vary: -10 / -8 suffixes, or an X
      // dimension (FS-100VBL659-48.000X120.000PT, where 48 is the width
      // and 120 is the length). Prefer the X dimension; fall back to
      // the trailing suffix; null when it cannot be read, in which
      // case thickness + color alone decide the match.
      const fsOorLengthFt = (code) => {
        const x = String(code || '').match(/X\s*(\d+)(?:\.0+)?/i);
        if (x) { const v = parseInt(x[1], 10); return v >= 110 ? 10 : 8; }
        const tail = String(code || '').match(/-(\d+)\s*[A-Z]*$/i);
        if (tail) {
          const v = parseInt(tail[1], 10);
          if (v === 10 || v === 8) return v;
          if (v >= 110) return 10;
          if (v === 96) return 8;
        }
        return null;
      };
      // FS queue: OOR lines for the same thickness + color (+ length
      // when readable), ahead of this order like the profile die queue.
      const fsQueueOrders = useMemo(() => {
        if (!selectedFs) return [];
        return openOrdersList.filter(o => {
          if (!o.itemPart || !o.itemPart.toUpperCase().startsWith('FS-')) return false;
          const m = o.itemPart.match(/^FS-(\d{3})([A-Z]+)/i);
          if (!m) return false;
          if (m[1] !== selectedFs.thicknessCode || m[2].toUpperCase() !== selectedFs.colorCode) return false;
          const lenFt = fsOorLengthFt(o.itemPart);
          if (lenFt != null && lenFt !== selectedFs.lengthFt) return false;
          return true;
        });
      }, [selectedFs, openOrdersList]);
      const fsCalc = useMemo(() => {
        if (!selectedFs) return null;
        // Sales 2.0 "available" is already NET of "qty on order"
        // (proven 2026-10-28: available + on-order is never negative,
        // and negative available rows are exactly over-committed
        // rows). Physical stock is available + on-order, and the
        // queue must be covered from physical: covering it from net
        // available deducts this SKU's own on-order twice, once inside
        // available and once as the queue. This assumes the OOR queue
        // includes this SKU's on-order qty (verified for
        // FS-125RBK042-120, where both are 4).
        const available = (selectedFs.qtyAvailable || 0) + (selectedFs.qtyOnOrder || 0);
        const requested = Number(fsQty) || 1;
        const asOf = parseSafeDate(quoteAsOfDate);
        const queueLines = fsQueueOrders.filter(o => o.uom === 'EACH');
        const queueQty = queueLines.reduce((s, o) => s + (o.qty || 0), 0);
        const queueCovered = Math.min(available, queueQty);
        const queueShortfall = queueQty - queueCovered;
        const remainingForOrder = available - queueCovered;
        const shortfall = Math.max(0, requested - remainingForOrder);
        const sheetsToMake = shortfall + queueShortfall;
        const needsProduction = sheetsToMake > 0;
        const coveragePct = requested > 0 ? Math.min(100, Math.round((remainingForOrder / requested) * 100)) : 0;
        // Sheets per billet (Nathan 2026-10-29): floor(billet
        // thickness / sheet thickness). A 1" billet gives one 0.75"
        // sheet, two 0.5" sheets, two 0.375" sheets, four 0.25"
        // sheets, eight 0.125" sheets. The old weight-based math
        // (sheets x lbs / billet lbs) wrongly split one billet
        // across sheets by weight. Thickness comes from the 3-digit
        // code in the part number (075 = 0.75"); the +1e-9 guards
        // against float error landing just under a whole number.
        const sheetThicknessIn = parseInt(selectedFs.thicknessCode, 10) / 100;
        const billetThicknessNum = selectedFs.billetThickness ? parseFloat(selectedFs.billetThickness) : null;
        const sheetsPerBillet = (sheetThicknessIn > 0 && billetThicknessNum)
          ? Math.max(0, Math.floor(billetThicknessNum / sheetThicknessIn + 1e-9))
          : 0;
        const billetsNeeded = (sheetsPerBillet > 0 && sheetsToMake > 0)
          ? Math.ceil(sheetsToMake / sheetsPerBillet)
          : 0;
        const billetStockKnown = !!selectedFs.billetKey && Object.prototype.hasOwnProperty.call(billetByType, selectedFs.billetKey);
        const billetStock = billetStockKnown ? billetByType[selectedFs.billetKey] : null;
        const billetShortfall = (billetsNeeded > 0 && billetStock != null) ? Math.max(0, billetsNeeded - billetStock) : null;
        // RatesByProfile in/hr for this billet family; billets/day =
        // in/hr x 24 hours of continuous running / billet length in
        // inches (10-foot = 120", 8-foot = 96").
        const fsInHr = selectedFs.billetThickness ? (fsRateByFamily[selectedFs.billetThickness] || null) : null;
        const billetLengthIn = selectedFs.lengthFt * 12;
        const billetsPerDay = (fsInHr && billetLengthIn) ? (fsInHr * 24) / billetLengthIn : null;
        const extrusionDays = (billetShortfall != null && billetsPerDay) ? Math.ceil(billetShortfall / billetsPerDay) : 0;
        // When billet stock, the die family, or the family rate is
        // unknown, extrusion time is unknown too: the estimate below
        // is process-only and the panel says so.
        const extrusionUnknown = needsProduction && ((billetsNeeded === 0 && sheetsToMake > 0 && sheetsPerBillet === 0) || billetStock == null || fsInHr == null);
        const processDays = needsProduction ? FS_PROCESS_DAYS : 0;
        // Line status: is this sheet's billet family + color running
        // on any full-sheet line right now? Turnover applies only
        // when billets must actually be extruded (a billet shortfall)
        // — billet-stock-covered orders need no die changeover, since
        // the 14-day process never touches the extrusion die. Current
        // orders ahead of this one are already sequenced first by the
        // queue/extrusion math above; the 2 days are the die
        // changeover + heat-up to the right color, on top of that.
        const runningMatches = selectedFs.billetThickness
          ? fsRunningLines.filter(l => l.billetThickness === selectedFs.billetThickness && l.colorLetters === selectedFs.colorCode)
          : [];
        const isFsRunning = runningMatches.length > 0;
        const turnoverDays = (!extrusionUnknown && extrusionDays > 0 && !isFsRunning) ? FS_TURNOVER_DAYS : 0;
        const totalCalendarDays = extrusionDays + turnoverDays + processDays;
        let readyDate = null, readyLabel = null;
        if (!needsProduction) {
